<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>홀과 주방 협업 지도</title>
    <style>
      :root { --bg:#f7f4ee; --card:#fffdf9; --text:#1f2937; --muted:#6b7280; --border:#eadfce; --accent:#c2410c; --soft:#ffedd5; }
      * { box-sizing:border-box; }
      html, body { margin:0; width:100%; height:100%; background:var(--bg); color:var(--text); font-family:'Pretendard Variable','Noto Sans KR',sans-serif; }
      body { overflow:hidden; }
      #app { width:100%; height:100%; overflow-y:auto; }
      .screen { min-height:100%; padding:16px 14px 22px; }
      .hero, .grid, .log { border:1px solid var(--border); border-radius:18px; background:var(--card); }
      .hero { padding:16px; background:linear-gradient(135deg,#fff7ed,#fffdf9); }
      .eyebrow { margin:0 0 6px; font-size:11px; color:var(--muted); }
      h1 { margin:0; font-size:18px; }
      .summary { margin:8px 0 0; font-size:12px; line-height:1.7; }
      .grid { margin-top:12px; padding:14px; display:grid; gap:10px; }
      .panel { padding:12px; border:1px solid var(--border); border-radius:14px; background:#fff; }
      .panel.active { border-color:var(--accent); background:var(--soft); }
      .label { font-size:12px; font-weight:700; }
      .desc { margin-top:4px; font-size:11px; line-height:1.6; color:var(--muted); }
      .chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
      .chip { padding:6px 10px; border:1px solid var(--border); border-radius:999px; background:#fff; font-size:11px; }
      .chip.hot { border-color:#fdba74; background:var(--soft); color:#9a3412; }
      .log { margin-top:12px; padding:12px 14px; background:#111827; color:#f8fafc; }
      .line { font-family:'JetBrains Mono',ui-monospace,monospace; font-size:10px; line-height:1.7; }
      .time { color:#fdba74; margin-right:6px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      const scenes = {
        '#front': { title:'프론트엔드 — 손님이 바로 만나는 홀', summary:'메뉴판, 버튼, 입력창, 화면 전환처럼 사용자가 직접 보는 경험을 맡습니다.', active:0, hot:0, chips:['화면 구성', '입력 반응', '모바일 배치', '읽기 쉬움'], logs:[['10:20:01','guest opened menu screen'],['10:20:02','button tap highlighted'],['10:20:03','layout adapted for mobile']] },
        '#back': { title:'백엔드 — 보이지 않는 주방 규칙', summary:'로그인 검사, 권한 확인, 계산, 데이터 저장처럼 뒤에서 질서를 지키는 일을 합니다.', active:1, hot:1, chips:['권한 검사', '주문 계산', '데이터 저장', '안정성'], logs:[['10:20:04','auth token verified'],['10:20:05','order total calculated'],['10:20:06','database write committed']] },
        '#contract': { title:'API — 홀과 주방의 주문 약속', summary:'화면과 서버는 어떤 요청을 보내고 어떤 결과를 돌려줄지 약속을 맞춰야 함께 움직입니다.', active:2, hot:2, chips:['요청 형식', '응답 형식', '에러 처리', '공통 약속'], logs:[['10:20:07','POST /orders sent'],['10:20:08','response: 201 created'],['10:20:09','error shape shared']] },
        '#scale': { title:'분리의 이점 — 각자 빠르게 개선하기', summary:'화면 흐름과 데이터 규칙을 나누면 팀이 동시에 작업하고 서비스도 더 유연하게 확장할 수 있습니다.', active:3, hot:3, chips:['동시 작업', '역할 분리', '확장 용이', '유지보수'], logs:[['10:20:10','frontend updated checkout UI'],['10:20:11','backend changed discount rule'],['10:20:12','contract kept service stable']] },
      };
      function render() {
        const scene = scenes[scenes[location.hash] ? location.hash : '#front'];
        const panels = [
          ['홀 화면', '사용자 경험'],
          ['주방 규칙', '비즈니스 로직'],
          ['주문 약속', 'API 연결'],
          ['확장', '분리의 장점'],
        ].map((item, index) => '<div class="panel' + (scene.active === index ? ' active' : '') + '"><div class="label">' + item[0] + '</div><div class="desc">' + (scene.active === index ? scene.summary : item[1]) + '</div></div>').join('');
        const chips = scene.chips.map((chip, index) => '<span class="chip' + (scene.hot === index ? ' hot' : '') + '">' + chip + '</span>').join('');
        const logs = scene.logs.map((row) => '<div class="line"><span class="time">' + row[0] + '</span>' + row[1] + '</div>').join('');
        document.getElementById('app').innerHTML = '<div class="screen"><section class="hero"><p class="eyebrow">Frontend vs Backend</p><h1>' + scene.title + '</h1><p class="summary">' + scene.summary + '</p></section><section class="grid">' + panels + '<div class="chips">' + chips + '</div></section><section class="log"><p class="eyebrow" style="color:#fed7aa;">협업 로그</p>' + logs + '</section></div>';
      }
      window.addEventListener('hashchange', render);
      render();
    </script>
  </body>
</html>
