<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>번들 포장 라인</title>
    <style>
      :root { --bg:#f4f7fb; --card:#fff; --text:#1f2937; --muted:#667085; --border:#d9e2ec; --accent:#1d4ed8; --soft:#dbeafe; }
      * { box-sizing:border-box; }
      html, body { margin:0; width:100%; height:100%; background:var(--bg); color:var(--text); font-family:'Pretendard Variable','Noto Sans KR',sans-serif; }
      body { overflow:hidden; }
      #app { width:100%; height:100%; overflow-y:auto; }
      .screen { min-height:100%; padding:16px 14px 22px; }
      .hero, .lineup, .log { border:1px solid var(--border); border-radius:18px; background:var(--card); }
      .hero { padding:16px; background:linear-gradient(135deg,#dbeafe,#ffffff); }
      .eyebrow { margin:0 0 6px; font-size:11px; color:var(--muted); }
      h1 { margin:0; font-size:18px; }
      .summary { margin:8px 0 0; font-size:12px; line-height:1.7; }
      .lineup { margin-top:12px; padding:14px; display:grid; gap:10px; }
      .step { padding:12px; border:1px solid var(--border); border-radius:14px; background:#fff; }
      .step.active { border-color:var(--accent); background:var(--soft); }
      .boxes { display:flex; gap:8px; margin-top:8px; }
      .box { flex:1; padding:8px; border-radius:10px; background:#f8fafc; font-size:10px; text-align:center; }
      .chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
      .chip { padding:6px 10px; border:1px solid var(--border); border-radius:999px; background:#fff; font-size:11px; }
      .chip.hot { border-color:#93c5fd; background:var(--soft); color:#1d4ed8; }
      .log { margin-top:12px; padding:12px 14px; background:#111827; color:#f8fafc; }
      .line { font-family:'JetBrains Mono',ui-monospace,monospace; font-size:10px; line-height:1.7; }
      .time { color:#93c5fd; margin-right:6px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      const scenes = {
        '#dev': { title:'개발 즉시 반영 — 저장하면 빨리 확인', summary:'개발할 때는 결과를 빠르게 보는 것이 중요합니다. 빌드 도구는 변경 내용을 즉시 반영해 작업 흐름을 매끄럽게 만듭니다.', active:0, hot:0, chips:['빠른 반영', '개발 서버', 'HMR', '생산성'], boxes:['save', 'rebuild', 'refresh'], logs:[['16:20:01','file saved'],['16:20:02','module hot-reloaded'],['16:20:03','screen updated in browser']] },
        '#bundle': { title:'파일 묶기 — 조각을 전달하기 좋은 단위로', summary:'코드와 스타일, 이미지가 여러 파일로 흩어져 있어도 배포할 때는 읽기 좋은 묶음으로 정리해야 합니다.', active:1, hot:1, chips:['bundle', 'modules', 'assets', 'delivery'], boxes:['app.ts', 'card.css', 'logo.svg'], logs:[['16:20:04','modules collected'],['16:20:05','assets linked'],['16:20:06','bundle graph built']] },
        '#optimize': { title:'최적화 — 덜 보내고 빨리 읽기', summary:'불필요한 코드를 줄이고 압축해 브라우저가 더 가볍게 받아들이도록 준비합니다.', active:2, hot:2, chips:['압축', '최소화', '분할', '성능'], boxes:['minify', 'split', 'compress'], logs:[['16:20:07','unused code removed'],['16:20:08','chunks split by route'],['16:20:09','assets compressed']] },
        '#ship': { title:'배포 준비 — 개발 재료를 서비스 도시락으로', summary:'이름은 달라도 Vite와 Webpack 같은 도구의 공통 목표는 개발용 재료를 안정적인 서비스 결과물로 바꾸는 것입니다.', active:3, hot:3, chips:['배포 준비', '안정성', '환경 대응', '포장'], boxes:['source', 'build', 'ship'], logs:[['16:20:10','production build completed'],['16:20:11','output uploaded'],['16:20:12','browser served optimized files']] },
      };
      function render() {
        const scene = scenes[scenes[location.hash] ? location.hash : '#dev'];
        const steps = [
          ['개발', '빠른 확인'],
          ['번들링', '묶어서 전달'],
          ['최적화', '가볍게 만들기'],
          ['배포', '서비스 준비'],
        ].map((item, index) => '<div class="step' + (scene.active === index ? ' active' : '') + '"><strong style="font-size:12px;">' + item[0] + '</strong><div style="font-size:11px;color:var(--muted);margin-top:4px;">' + (scene.active === index ? scene.summary : item[1]) + '</div><div class="boxes">' + scene.boxes.map((value) => '<div class="box">' + value + '</div>').join('') + '</div></div>').join('');
        const chips = scene.chips.map((chip, index) => '<span class="chip' + (scene.hot === index ? ' hot' : '') + '">' + chip + '</span>').join('');
        const logs = scene.logs.map((row) => '<div class="line"><span class="time">' + row[0] + '</span>' + row[1] + '</div>').join('');
        document.getElementById('app').innerHTML = '<div class="screen"><section class="hero"><p class="eyebrow">Build Tools</p><h1>' + scene.title + '</h1><p class="summary">' + scene.summary + '</p></section><section class="lineup">' + steps + '<div class="chips">' + chips + '</div></section><section class="log"><p class="eyebrow" style="color:#bfdbfe;">포장 로그</p>' + logs + '</section></div>';
      }
      window.addEventListener('hashchange', render);
      render();
    </script>
  </body>
</html>
