<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>API 접수 창구</title>
    <style>
      :root { --bg:#f4f8f7; --card:#fff; --text:#16312d; --muted:#5f7b74; --border:#d5e7e2; --accent:#0f766e; --soft:#ccfbf1; }
      * { box-sizing:border-box; }
      html, body { margin:0; width:100%; height:100%; background:var(--bg); color:var(--text); font-family:'Pretendard Variable','Noto Sans KR',sans-serif; }
      body { overflow:hidden; }
      #app { width:100%; height:100%; overflow-y:auto; }
      .screen { min-height:100%; padding:16px 14px 22px; }
      .hero, .queue, .log { border:1px solid var(--border); border-radius:18px; background:var(--card); }
      .hero { padding:16px; background:linear-gradient(135deg,#ccfbf1,#ffffff); }
      .eyebrow { margin:0 0 6px; font-size:11px; color:var(--muted); }
      h1 { margin:0; font-size:18px; }
      .summary { margin:8px 0 0; font-size:12px; line-height:1.7; }
      .queue { margin-top:12px; padding:14px; display:grid; gap:10px; }
      .row { padding:12px; border:1px solid var(--border); border-radius:14px; background:#fff; }
      .row.active { border-color:var(--accent); background:var(--soft); }
      .code { margin-top:8px; padding:8px 10px; border-radius:10px; background:#0f172a; color:#d1fae5; font-family:'JetBrains Mono',ui-monospace,monospace; font-size:10px; }
      .chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
      .chip { padding:6px 10px; border:1px solid var(--border); border-radius:999px; background:#fff; font-size:11px; }
      .chip.hot { border-color:#5eead4; background:var(--soft); color:#115e59; }
      .log { margin-top:12px; padding:12px 14px; background:#111827; color:#f8fafc; }
      .line { font-family:'JetBrains Mono',ui-monospace,monospace; font-size:10px; line-height:1.7; }
      .time { color:#5eead4; margin-right:6px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      const scenes = {
        '#request': { title:'API — 요청과 응답의 창구', summary:'프론트엔드는 필요한 정보를 약속된 형식으로 요청하고, 서버는 약속된 형태로 답을 돌려줍니다.', active:0, hot:0, chips:['주소', '요청', '응답', '형식'], code:'GET /users/12\\n-> 200 OK\\n{ id: 12, name: "Mina" }', logs:[['12:00:01','request accepted'],['12:00:02','user data loaded'],['12:00:03','response rendered']] },
        '#resource': { title:'REST — 대상을 자원으로 나누기', summary:'사용자, 주문, 게시글처럼 무엇을 다루는지를 주소에서 짐작할 수 있게 정리합니다.', active:1, hot:1, chips:['users', 'orders', 'posts', 'resources'], code:'/users\\n/orders\\n/posts', logs:[['12:00:04','resource group selected'],['12:00:05','route naming normalized'],['12:00:06','reader inferred target']] },
        '#method': { title:'메서드 — 행동을 구분하는 손잡이', summary:'가져오기, 만들기, 수정하기, 삭제하기 같은 행동을 메서드와 함께 표현합니다.', active:2, hot:2, chips:['GET', 'POST', 'PATCH', 'DELETE'], code:'GET /orders\\nPOST /orders\\nPATCH /orders/15', logs:[['12:00:07','GET mapped to read'],['12:00:08','POST mapped to create'],['12:00:09','PATCH mapped to update']] },
        '#stateless': { title:'한 번의 요청에 필요한 정보를 담기', summary:'서버가 숨은 기억에 의존하지 않도록, 요청마다 필요한 맥락을 분명히 포함하는 쪽이 단순합니다.', active:3, hot:3, chips:['명확한 요청', '확장성', '독립 처리', '일관성'], code:'Authorization: Bearer ...\\nBody: { itemId: 7, qty: 2 }', logs:[['12:00:10','auth included in request'],['12:00:11','payload self-contained'],['12:00:12','server handled request independently']] },
      };
      function render() {
        const scene = scenes[scenes[location.hash] ? location.hash : '#request'];
        const rows = [
          ['창구', 'API'],
          ['자원', 'REST naming'],
          ['행동', 'HTTP methods'],
          ['독립 요청', 'stateless'],
        ].map((item, index) => '<div class="row' + (scene.active === index ? ' active' : '') + '"><strong style="font-size:12px;">' + item[0] + '</strong><div style="font-size:11px;color:var(--muted);margin-top:4px;">' + (scene.active === index ? scene.summary : item[1]) + '</div>' + (scene.active === index ? '<div class="code">' + scene.code.replace(/\\n/g, '<br/>') + '</div>' : '') + '</div>').join('');
        const chips = scene.chips.map((chip, index) => '<span class="chip' + (scene.hot === index ? ' hot' : '') + '">' + chip + '</span>').join('');
        const logs = scene.logs.map((row) => '<div class="line"><span class="time">' + row[0] + '</span>' + row[1] + '</div>').join('');
        document.getElementById('app').innerHTML = '<div class="screen"><section class="hero"><p class="eyebrow">API · REST</p><h1>' + scene.title + '</h1><p class="summary">' + scene.summary + '</p></section><section class="queue">' + rows + '<div class="chips">' + chips + '</div></section><section class="log"><p class="eyebrow" style="color:#99f6e4;">창구 로그</p>' + logs + '</section></div>';
      }
      window.addEventListener('hashchange', render);
      render();
    </script>
  </body>
</html>
