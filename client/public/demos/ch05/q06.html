<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>프레임워크 공구함</title>
    <style>
      :root { --bg:#f8f4f1; --card:#fff; --text:#2d221d; --muted:#7b685f; --border:#eadccf; --accent:#b45309; --soft:#ffedd5; }
      * { box-sizing:border-box; }
      html, body { margin:0; width:100%; height:100%; background:var(--bg); color:var(--text); font-family:'Pretendard Variable','Noto Sans KR',sans-serif; }
      body { overflow:hidden; }
      #app { width:100%; height:100%; overflow-y:auto; }
      .screen { min-height:100%; padding:16px 14px 22px; }
      .hero, .kit, .log { border:1px solid var(--border); border-radius:18px; background:var(--card); }
      .hero { padding:16px; background:linear-gradient(135deg,#ffedd5,#ffffff); }
      .eyebrow { margin:0 0 6px; font-size:11px; color:var(--muted); }
      h1 { margin:0; font-size:18px; }
      .summary { margin:8px 0 0; font-size:12px; line-height:1.7; }
      .kit { margin-top:12px; padding:14px; display:grid; gap:10px; }
      .slot { padding:12px; border:1px solid var(--border); border-radius:14px; background:#fff; }
      .slot.active { border-color:var(--accent); background:var(--soft); }
      .items { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
      .item { padding:5px 8px; border-radius:999px; background:#fff; border:1px solid var(--border); font-size:10px; }
      .item.hot { border-color:#fdba74; color:#9a3412; }
      .log { margin-top:12px; padding:12px 14px; background:#111827; color:#f8fafc; }
      .line { font-family:'JetBrains Mono',ui-monospace,monospace; font-size:10px; line-height:1.7; }
      .time { color:#fdba74; margin-right:6px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      const scenes = {
        '#repeat': { title:'반복 공사 줄이기', summary:'화면을 매번 처음부터 짜기보다, 자주 만나는 패턴을 공통 규칙으로 가져가면 속도와 일관성이 올라갑니다.', active:0, hot:0, items:['반복 감소', '공통 규칙', '빠른 개발', '실수 감소'], logs:[['15:10:01','same card UI repeated 8 times'],['15:10:02','shared pattern extracted'],['15:10:03','maintenance cost reduced']] },
        '#component': { title:'컴포넌트 조립 — 작은 조각으로 큰 화면 만들기', summary:'버튼, 카드, 목록을 컴포넌트로 나누면 재사용과 수정 범위가 더 선명해집니다.', active:1, hot:1, items:['Button', 'Card', 'List', 'Modal'], logs:[['15:10:04','button component reused'],['15:10:05','card style shared'],['15:10:06','screen assembled from parts']] },
        '#choice': { title:'도구 고르기 — 장점은 다르지만 목표는 비슷하다', summary:'React, Vue, Svelte는 서로 결이 다르지만 모두 반복되는 UI 문제를 구조적으로 풀도록 돕습니다.', active:2, hot:2, items:['생태계', '문법 취향', '팀 경험', '유지보수'], logs:[['15:10:07','team compared options'],['15:10:08','ecosystem weighed'],['15:10:09','choice matched constraints']] },
        '#team': { title:'팀 규칙 맞추기 — 개인 기술보다 공통 구조', summary:'서비스가 커질수록 누가 와도 읽을 수 있는 구조와 재사용 방식이 중요해집니다.', active:3, hot:3, items:['온보딩', '일관성', '리뷰 쉬움', '협업'], logs:[['15:10:10','new dev joined project'],['15:10:11','shared patterns sped review'],['15:10:12','team moved with same conventions']] },
      };
      function render() {
        const scene = scenes[scenes[location.hash] ? location.hash : '#repeat'];
        const slots = [
          ['반복 문제', '공통 패턴 만들기'],
          ['컴포넌트', '조각 조립'],
          ['선택 기준', '도구 비교'],
          ['팀 협업', '공통 구조'],
        ].map((item, index) => '<div class="slot' + (scene.active === index ? ' active' : '') + '"><strong style="font-size:12px;">' + item[0] + '</strong><div style="font-size:11px;color:var(--muted);margin-top:4px;">' + (scene.active === index ? scene.summary : item[1]) + '</div><div class="items">' + scene.items.map((chip, chipIndex) => '<span class="item' + (scene.hot === chipIndex ? ' hot' : '') + '">' + chip + '</span>').join('') + '</div></div>').join('');
        const logs = scene.logs.map((row) => '<div class="line"><span class="time">' + row[0] + '</span>' + row[1] + '</div>').join('');
        document.getElementById('app').innerHTML = '<div class="screen"><section class="hero"><p class="eyebrow">Frameworks & Libraries</p><h1>' + scene.title + '</h1><p class="summary">' + scene.summary + '</p></section><section class="kit">' + slots + '</section><section class="log"><p class="eyebrow" style="color:#fed7aa;">공구함 로그</p>' + logs + '</section></div>';
      }
      window.addEventListener('hashchange', render);
      render();
    </script>
  </body>
</html>
