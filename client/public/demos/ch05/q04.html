<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>렌더링 레이스</title>
    <style>
      :root { --bg:#f6f5fb; --card:#fff; --text:#241b38; --muted:#716587; --border:#e2d9f1; --accent:#7c3aed; --soft:#ede9fe; }
      * { box-sizing:border-box; }
      html, body { margin:0; width:100%; height:100%; background:var(--bg); color:var(--text); font-family:'Pretendard Variable','Noto Sans KR',sans-serif; }
      body { overflow:hidden; }
      #app { width:100%; height:100%; overflow-y:auto; }
      .screen { min-height:100%; padding:16px 14px 22px; }
      .hero, .track, .log { border:1px solid var(--border); border-radius:18px; background:var(--card); }
      .hero { padding:16px; background:linear-gradient(135deg,#ede9fe,#ffffff); }
      .eyebrow { margin:0 0 6px; font-size:11px; color:var(--muted); }
      h1 { margin:0; font-size:18px; }
      .summary { margin:8px 0 0; font-size:12px; line-height:1.7; }
      .track { margin-top:12px; padding:14px; display:grid; gap:10px; }
      .lane { padding:12px; border:1px solid var(--border); border-radius:14px; background:#fff; }
      .lane.active { border-color:var(--accent); background:var(--soft); }
      .meters { display:flex; gap:8px; margin-top:8px; }
      .meter { height:10px; border-radius:999px; background:#ddd6fe; }
      .chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
      .chip { padding:6px 10px; border:1px solid var(--border); border-radius:999px; background:#fff; font-size:11px; }
      .chip.hot { border-color:#c4b5fd; background:var(--soft); color:#5b21b6; }
      .log { margin-top:12px; padding:12px 14px; background:#111827; color:#f8fafc; }
      .line { font-family:'JetBrains Mono',ui-monospace,monospace; font-size:10px; line-height:1.7; }
      .time { color:#c4b5fd; margin-right:6px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      const scenes = {
        '#spa-start': { title:'SPA 첫 준비 — 코드를 먼저 받기', summary:'처음에는 자바스크립트 준비 시간이 필요하지만, 준비가 끝나면 브라우저 안에서 화면을 바꾸기 쉬워집니다.', active:0, hot:0, chips:['초기 로드', '브라우저 렌더', '앱 감각', '준비 시간'], meters:[70,28,18], logs:[['13:10:01','bundle requested'],['13:10:02','app bootstrapped'],['13:10:03','first route hydrated']] },
        '#spa-move': { title:'SPA 이후 이동 — 필요한 부분만 교체', summary:'다음 화면으로 갈 때 페이지 전체를 다시 열기보다, 바뀐 부분만 갱신하는 느낌을 줄 수 있습니다.', active:1, hot:1, chips:['빠른 전환', '부분 갱신', '부드러움', '상태 유지'], meters:[20,62,26], logs:[['13:10:04','route changed client-side'],['13:10:05','state kept alive'],['13:10:06','view swapped smoothly']] },
        '#ssr-start': { title:'SSR 첫 응답 — 서버가 먼저 그려서 보내기', summary:'서버가 완성된 HTML을 먼저 보내므로 첫 화면 내용을 빨리 읽을 수 있는 경우가 많습니다.', active:2, hot:2, chips:['첫 화면', 'HTML 선제공', '검색 친화', '초기 가독성'], meters:[24,54,68], logs:[['13:10:07','server rendered html'],['13:10:08','content visible early'],['13:10:09','client scripts attached later']] },
        '#mix': { title:'혼합 전략 — 둘의 장점을 조합하기', summary:'실무에서는 첫 화면은 빠르게 보여 주고, 이후 상호작용은 앱처럼 부드럽게 만드는 혼합 전략도 흔합니다.', active:3, hot:3, chips:['하이브리드', '첫인상', '상호작용', '상황별 선택'], meters:[52,56,52], logs:[['13:10:10','landing used server render'],['13:10:11','dashboard used client transitions'],['13:10:12','strategy matched user flow']] },
      };
      function render() {
        const scene = scenes[scenes[location.hash] ? location.hash : '#spa-start'];
        const lanes = [
          ['SPA start', '초기 준비'],
          ['SPA move', '이후 이동'],
          ['SSR start', '첫 응답'],
          ['Mix', '혼합 전략'],
        ].map((item, index) => '<div class="lane' + (scene.active === index ? ' active' : '') + '"><strong style="font-size:12px;">' + item[0] + '</strong><div style="font-size:11px;color:var(--muted);margin-top:4px;">' + (scene.active === index ? scene.summary : item[1]) + '</div><div class="meters">' + scene.meters.map((width) => '<div class="meter" style="width:' + width + '%;"></div>').join('') + '</div></div>').join('');
        const chips = scene.chips.map((chip, index) => '<span class="chip' + (scene.hot === index ? ' hot' : '') + '">' + chip + '</span>').join('');
        const logs = scene.logs.map((row) => '<div class="line"><span class="time">' + row[0] + '</span>' + row[1] + '</div>').join('');
        document.getElementById('app').innerHTML = '<div class="screen"><section class="hero"><p class="eyebrow">SPA vs SSR</p><h1>' + scene.title + '</h1><p class="summary">' + scene.summary + '</p></section><section class="track">' + lanes + '<div class="chips">' + chips + '</div></section><section class="log"><p class="eyebrow" style="color:#ddd6fe;">렌더 로그</p>' + logs + '</section></div>';
      }
      window.addEventListener('hashchange', render);
      render();
    </script>
  </body>
</html>
