<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>부팅 이어달리기</title>
    <style>
      :root {
        --bg: #fffdf8;
        --card: #ffffff;
        --border: #e7e5e4;
        --text: #1c1917;
        --muted: #78716c;
        --accent: #2563eb;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; font-family: 'Pretendard Variable', 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); }
      body { overflow: hidden; }
      .demo { height: 100%; padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 10px; font-size: 12px; overflow-y: auto; }
      h4 { margin: 0; font-size: 14px; }
      .sub { margin: 0; color: var(--muted); line-height: 1.5; }
      .steps { display: grid; gap: 8px; }
      .step { border: 1px solid var(--border); border-radius: 12px; background: var(--card); padding: 10px 12px; }
      .step.active { border-color: var(--accent); background: #eff6ff; }
      .tag { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
      .note { border-radius: 12px; background: #111827; color: #f9fafb; padding: 10px 12px; line-height: 1.6; }
    </style>
  </head>
  <body>
    <div id="screen"></div>
    <script>
      const scenarioMap = {
        '#power': { active: 0, items: [['전원', '기판에 신호가 들어오고 시작 절차가 열립니다.'], ['POST', '기본 하드웨어 점검을 준비합니다.']] },
        '#firmware': { active: 1, items: [['BIOS/UEFI', '메모리와 저장 장치 등 최소 동작을 확인합니다.'], ['다음 단계', '어디에서 운영체제를 읽을지 결정합니다.']] },
        '#bootloader': { active: 2, items: [['부트로더', '커널 파일을 메모리에 올립니다.'], ['선택', '여러 운영체제가 있으면 여기서 고를 수 있습니다.']] },
        '#kernel': { active: 3, items: [['커널', '드라이버와 파일 시스템, 초기 프로세스를 띄웁니다.'], ['준비 완료', '로그인 화면 직전까지 시스템을 정비합니다.']] },
        '#login': { active: 4, items: [['사용자 공간', '로그인 화면과 데스크톱 셸이 뜹니다.'], ['체감', '사용자는 이제야 컴퓨터가 켜졌다고 느낍니다.']] },
      };

      function render() {
        const hash = scenarioMap[location.hash] ? location.hash : '#power';
        const { active, items } = scenarioMap[hash];
        const labels = ['전원', '펌웨어', '부트로더', '커널', '로그인'];
        const steps = labels.map((label, idx) => '<div class="step' + (idx === active ? ' active' : '') + '"><div class="tag">' + (idx + 1) + '단계</div><div>' + label + '</div></div>').join('');
        const details = items.map(([k, v]) => '<div class="step"><div class="tag">' + k + '</div><div>' + v + '</div></div>').join('');
        document.getElementById('screen').innerHTML =
          '<div class="demo">' +
          '<h4>부팅 이어달리기</h4>' +
          '<p class="sub">시스템은 작은 시작 코드에서 커널까지 제어권을 차례로 넘기며 준비됩니다.</p>' +
          '<div class="steps">' + steps + '</div>' +
          '<div class="steps">' + details + '</div>' +
          '<div class="note">▶ 부팅은 한 번에 완성되는 점프가 아니라, 펌웨어와 부트로더, 커널이 순서를 지키며 제어권을 넘기는 이어달리기입니다.</div>' +
          '</div>';
      }

      window.addEventListener('hashchange', render);
      render();
    </script>
  </body>
</html>
