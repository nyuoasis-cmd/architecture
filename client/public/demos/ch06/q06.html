<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>시간 분할 스케줄러</title>
    <style>
      :root {
        --bg: #fffdf8;
        --card: #ffffff;
        --border: #e7e5e4;
        --text: #1c1917;
        --muted: #78716c;
        --accent: #7c3aed;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; font-family: 'Pretendard Variable', 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); }
      body { overflow: hidden; }
      .demo { height: 100%; padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 10px; font-size: 12px; overflow-y: auto; }
      h4 { margin: 0; font-size: 14px; }
      .sub { margin: 0; color: var(--muted); line-height: 1.5; }
      .bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
      .slot { border-radius: 10px; padding: 8px 6px; text-align: center; border: 1px solid var(--border); background: #fff; }
      .slot.active { background: #f3e8ff; border-color: var(--accent); }
      .board { border: 1px solid var(--border); border-radius: 12px; background: var(--card); padding: 10px 12px; line-height: 1.7; }
      .note { border-radius: 12px; background: #111827; color: #f9fafb; padding: 10px 12px; line-height: 1.6; }
    </style>
  </head>
  <body>
    <div id="screen"></div>
    <script>
      const scenarioMap = {
        '#slice': { active: 0, text: '운영체제는 작업마다 아주 짧은 시간 조각을 배분합니다. 한 앱이 CPU를 오래 독점하지 못하게 막는 출발점입니다.' },
        '#switch': { active: 1, text: '시간이 다 되면 현재 레지스터 상태를 저장하고 다른 작업의 상태를 불러옵니다. 이것이 문맥 교환입니다.' },
        '#priority': { active: 2, text: '모든 작업을 똑같이만 다루지 않고, 화면 반응처럼 급한 작업은 더 빨리 다시 CPU를 받을 수 있습니다.' },
        '#illusion': { active: 3, text: '사용자는 음악, 브라우저, 문서가 동시에 돌아간다고 느끼지만, 실제로는 매우 빠른 순환이 체감 동시성을 만듭니다.' },
      };

      function render() {
        const hash = scenarioMap[location.hash] ? location.hash : '#slice';
        const { active, text } = scenarioMap[hash];
        const labels = ['앱 A', '앱 B', '앱 C', '앱 A'];
        const slots = labels.map((label, idx) => '<div class="slot' + (idx === active ? ' active' : '') + '">' + label + '<br/><small>' + (idx + 1) + '번째 시간</small></div>').join('');
        document.getElementById('screen').innerHTML =
          '<div class="demo">' +
          '<h4>시간 분할 스케줄러</h4>' +
          '<p class="sub">CPU는 하나여도 시간을 잘게 나눠 여러 작업을 번갈아 처리할 수 있습니다.</p>' +
          '<div class="bar">' + slots + '</div>' +
          '<div class="board">' + text + '</div>' +
          '<div class="note">▶ 멀티태스킹의 핵심은 한순간의 마법이 아니라, 전환을 충분히 빠르게 만들어 사용자가 동시에 느끼게 하는 데 있습니다.</div>' +
          '</div>';
      }

      window.addEventListener('hashchange', render);
      render();
    </script>
  </body>
</html>
