<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>파일 시스템 지도실</title>
    <style>
      :root {
        --bg: #fffdf8;
        --card: #ffffff;
        --border: #e7e5e4;
        --text: #1c1917;
        --muted: #78716c;
        --accent: #059669;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; font-family: 'Pretendard Variable', 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); }
      body { overflow: hidden; }
      .demo { height: 100%; padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 10px; font-size: 12px; overflow-y: auto; }
      h4 { margin: 0; font-size: 14px; }
      .sub { margin: 0; color: var(--muted); line-height: 1.5; }
      .tree, .meta { border: 1px solid var(--border); border-radius: 12px; background: var(--card); padding: 10px 12px; }
      .tree.active, .meta.active { border-color: var(--accent); background: #ecfdf5; }
      .row { padding: 4px 0; }
      .row small { color: var(--muted); }
      .note { border-radius: 12px; background: #111827; color: #f9fafb; padding: 10px 12px; line-height: 1.6; }
    </style>
  </head>
  <body>
    <div id="screen"></div>
    <script>
      const scenarioMap = {
        '#folders': { tree: true, title: '폴더 구조', body: ['projects/', '  chapter6.md', '  demos/', '    q08.html'], note: '디렉터리는 사람이 파일을 찾기 쉬운 계층 구조를 만들어 줍니다.' },
        '#inode': { meta: true, title: 'inode 카드', body: ['이름: chapter6.md', '권한: rw-r--r--', '크기: 18KB', '블록: 204, 205'], note: 'inode 같은 메타데이터 구조는 이름 뒤에서 실제 위치와 속성을 기록합니다.' },
        '#blocks': { meta: true, title: '실제 저장 위치', body: ['블록 204 → 본문 앞부분', '블록 205 → 본문 뒷부분', '폴더 이름과 분리 관리'], note: '파일 이름표와 실제 데이터 위치는 같은 것이 아닙니다.' },
        '#journal': { meta: true, title: '저널링 기록', body: ['1. 변경 예정 기록', '2. 실제 반영', '3. 완료 표시'], note: '저널링은 갑작스러운 종료가 나도 어디까지 반영됐는지 확인하게 도와줍니다.' },
      };

      function render() {
        const hash = scenarioMap[location.hash] ? location.hash : '#folders';
        const { tree, meta, title, body, note } = scenarioMap[hash];
        const lines = body.map((line) => '<div class="row">' + line + '</div>').join('');
        document.getElementById('screen').innerHTML =
          '<div class="demo">' +
          '<h4>파일 시스템 지도실</h4>' +
          '<p class="sub">파일을 잘 보관한다는 것은 이름표, 실제 위치, 복구 규칙을 함께 정리한다는 뜻입니다.</p>' +
          '<div class="tree' + (tree ? ' active' : '') + '"><small>디렉터리 보기</small>' + (tree ? lines : '<div class="row">projects/<br/>  chapter6.md</div>') + '</div>' +
          '<div class="meta' + (meta ? ' active' : '') + '"><small>' + title + '</small>' + lines + '</div>' +
          '<div class="note">▶ ' + note + '</div>' +
          '</div>';
      }

      window.addEventListener('hashchange', render);
      render();
    </script>
  </body>
</html>
