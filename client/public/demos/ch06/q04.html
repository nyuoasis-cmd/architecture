<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>캐시 적중 실험실</title>
    <style>
      :root {
        --bg: #fffaf5;
        --card: #ffffff;
        --border: #e7e5e4;
        --text: #1f2937;
        --muted: #6b7280;
        --accent: #d97706;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; font-family: 'Pretendard Variable', 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); }
      body { overflow: hidden; }
      .demo { height: 100%; padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 10px; font-size: 12px; overflow-y: auto; }
      h4 { margin: 0; font-size: 14px; }
      .sub { margin: 0; color: var(--muted); line-height: 1.5; }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; }
      .chip { padding: 6px 10px; border-radius: 999px; border: 1px solid var(--border); background: #fff; }
      .chip.hot { background: #fef3c7; border-color: #f59e0b; }
      .board { display: grid; gap: 8px; }
      .row { border: 1px solid var(--border); border-radius: 12px; background: var(--card); padding: 10px 12px; }
      .row strong { display: block; margin-bottom: 4px; }
      .note { border-radius: 12px; background: #111827; color: #f9fafb; padding: 10px 12px; line-height: 1.6; }
    </style>
  </head>
  <body>
    <div id="screen"></div>
    <script>
      const scenarioMap = {
        '#recent': {
          chips: ['A*', 'A', 'B', 'C'],
          title: '시간 지역성',
          text: '방금 읽은 A를 곧 다시 찾으면 캐시에 남아 있을 가능성이 큽니다.',
        },
        '#nearby': {
          chips: ['120*', '121*', '122', '500'],
          title: '공간 지역성',
          text: '서로 가까운 주소를 연달아 읽으면 한 번 불러온 주변 데이터도 같이 활용하기 쉽습니다.',
        },
        '#hit': {
          chips: ['요청 X', '캐시에 X*', 'RAM 대기 없음'],
          title: '캐시 적중',
          text: '필요한 값이 이미 가까이에 있어 CPU가 기다리지 않고 바로 계산을 이어 갑니다.',
        },
        '#miss': {
          chips: ['요청 Y', '캐시 없음', 'RAM 접근*'],
          title: '캐시 미스',
          text: '캐시에 없으면 RAM까지 내려가야 해서 같은 CPU라도 체감 속도가 떨어집니다.',
        },
        '#levels': {
          chips: ['L1*', 'L2', 'L3', 'RAM'],
          title: '여러 단계 캐시',
          text: 'L1이 가장 빠르고 작고, L2와 L3는 조금 더 크지만 멀어집니다. 가까운 단계에서 해결될수록 좋습니다.',
        },
      };

      function render() {
        const hash = scenarioMap[location.hash] ? location.hash : '#recent';
        const { chips, title, text } = scenarioMap[hash];
        const chipHtml = chips.map((label) => '<span class="chip' + (label.includes('*') ? ' hot' : '') + '">' + label.replace('*', '') + '</span>').join('');
        document.getElementById('screen').innerHTML =
          '<div class="demo">' +
          '<h4>캐시 적중 실험실</h4>' +
          '<p class="sub">자주 쓰는 데이터를 가까이에 둘수록 CPU의 대기 시간이 줄어듭니다.</p>' +
          '<div class="chips">' + chipHtml + '</div>' +
          '<div class="board"><div class="row"><strong>' + title + '</strong><span>' + text + '</span></div></div>' +
          '<div class="note">▶ 캐시는 CPU를 더 빨리 계산하게 한다기보다, 기다리는 시간을 줄여 전체 성능을 끌어올립니다.</div>' +
          '</div>';
      }

      window.addEventListener('hashchange', render);
      render();
    </script>
  </body>
</html>
