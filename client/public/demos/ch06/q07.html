<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>가상 메모리 호텔</title>
    <style>
      :root {
        --bg: #f8fafc;
        --card: #ffffff;
        --border: #dbe4ee;
        --text: #0f172a;
        --muted: #64748b;
        --accent: #1d4ed8;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; font-family: 'Pretendard Variable', 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); }
      body { overflow: hidden; }
      .demo { height: 100%; padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 10px; font-size: 12px; overflow-y: auto; }
      h4 { margin: 0; font-size: 14px; }
      .sub { margin: 0; color: var(--muted); line-height: 1.5; }
      .columns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .card { border: 1px solid var(--border); border-radius: 12px; background: var(--card); padding: 10px 12px; }
      .card.active { border-color: var(--accent); background: #eff6ff; }
      .head { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
      .note { border-radius: 12px; background: #111827; color: #f9fafb; padding: 10px 12px; line-height: 1.6; }
    </style>
  </head>
  <body>
    <div id="screen"></div>
    <script>
      const scenarioMap = {
        '#virtual': { left: ['가상 주소 1000', '가상 주소 1001'], right: ['실제 위치는 아직 숨김'], active: 'left', note: '프로그램은 넓고 연속된 자기 주소 공간을 보는 것처럼 동작합니다.' },
        '#physical': { left: ['가상 페이지 A', '가상 페이지 B'], right: ['RAM 프레임 7', 'RAM 프레임 2'], active: 'right', note: '운영체제와 MMU가 가상 주소를 실제 물리 메모리 위치에 연결합니다.' },
        '#swap': { left: ['가상 페이지 A', '가상 페이지 C'], right: ['RAM 프레임 7', '스왑 공간'], active: 'right', note: '덜 쓰는 페이지는 디스크 스왑 공간으로 밀려날 수 있지만, 자주 오가면 매우 느려집니다.' },
        '#protect': { left: ['프로세스 A 주소 공간', '프로세스 B 주소 공간'], right: ['서로 다른 매핑 규칙'], active: 'left', note: '프로그램마다 주소 공간을 따로 보이게 하므로 서로의 메모리를 함부로 침범하기 어렵습니다.' },
      };

      function render() {
        const hash = scenarioMap[location.hash] ? location.hash : '#virtual';
        const { left, right, active, note } = scenarioMap[hash];
        const list = (items) => items.map((item) => '<div style="padding:6px 8px;border:1px solid var(--border);border-radius:8px;background:#fff;margin-top:6px;">' + item + '</div>').join('');
        document.getElementById('screen').innerHTML =
          '<div class="demo">' +
          '<h4>가상 메모리 호텔</h4>' +
          '<p class="sub">사용자에게 보이는 방 번호와 실제 배정된 방이 다를 수 있습니다.</p>' +
          '<div class="columns">' +
          '<div class="card' + (active === 'left' ? ' active' : '') + '"><div class="head">프로그램이 보는 주소</div>' + list(left) + '</div>' +
          '<div class="card' + (active === 'right' ? ' active' : '') + '"><div class="head">실제 배치</div>' + list(right) + '</div>' +
          '</div>' +
          '<div class="note">▶ ' + note + '</div>' +
          '</div>';
      }

      window.addEventListener('hashchange', render);
      render();
    </script>
  </body>
</html>
