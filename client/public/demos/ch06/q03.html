<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>카톡 프로세스 시뮬레이터</title>
    <style>
      :root {
        --color-text-primary: #1c1917;
        --color-text-body: #57534e;
        --color-text-muted: #78716c;
        --color-text-faint: #a8a29e;
        --color-border: #e7e5e4;
        --color-bg-card: #ffffff;
        --color-bg-subtle: #fafaf9;
        --color-accent: #6366f1;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #fff;
        color: var(--color-text-primary);
        font-family: 'Pretendard Variable', 'Noto Sans KR', sans-serif;
      }

      body {
        overflow: hidden;
      }

      #screen {
        width: 100%;
        height: 100%;
      }

      .demo {
        width: 100%;
        height: 100%;
        padding: 36px 16px 16px;
        display: flex;
        flex-direction: column;
        font-size: 12px;
        color: var(--color-text-primary);
        overflow-y: auto;
      }

      .demo h4 {
        margin: 0 0 8px;
        font-size: 13px;
        font-weight: 600;
      }

      .sub {
        margin: 0 0 12px;
        color: var(--color-text-muted);
        font-size: 11px;
      }

      .demo-tier {
        border: 1.5px solid var(--color-border);
        border-radius: 10px;
        padding: 10px;
        background: var(--color-bg-subtle);
      }

      .demo-tier.active {
        border-color: var(--color-accent);
        background: rgba(99, 102, 241, 0.05);
      }

      .demo-tier-label {
        margin: 0 0 4px;
        color: var(--color-text-muted);
        font-size: 10px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      .demo-chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 4px 8px;
        border-radius: 999px;
        background: #fff;
        border: 1px solid var(--color-border);
        font-size: 11px;
        margin: 0 6px 6px 0;
      }

      .demo-chip.proc {
        background: var(--color-accent);
        color: #fff;
        border-color: transparent;
      }

      .demo-arrow {
        margin: 4px 0;
        color: var(--color-text-faint);
        text-align: center;
        font-size: 14px;
        line-height: 1;
      }

      .demo-cpu-cores {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
        margin-top: 6px;
      }

      .demo-core {
        border: 1px solid var(--color-border);
        border-radius: 6px;
        padding: 4px 6px;
        font-size: 10px;
        background: #fff;
        text-align: center;
      }

      .demo-core.busy {
        background: var(--color-accent);
        color: #fff;
        border-color: transparent;
      }

      .demo-log {
        margin-top: 10px;
        background: #1c1917;
        color: #fafaf9;
        border-radius: 8px;
        padding: 8px 10px;
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 10px;
        line-height: 1.6;
      }

      .ts {
        color: #a8a29e;
        margin-right: 4px;
      }

      .caption {
        margin-top: 12px;
        color: var(--color-text-body);
        font-size: 11px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div id="screen"></div>
    <script>
      const scenarioMap = {
        '#launch': {
          summary: '디스크의 카톡.apk가 메모리에 올라가 프로세스가 되고, CPU 코어1이 처리합니다.',
          memory: ['⚡ 카톡 PID 1'],
          cpu: ['코어1 · 카톡', '코어2 · 대기', '코어3 · 대기', '코어4 · 대기'],
          logs: [
            ['10:24:01', '카톡.apk → 프로세스 생성 (PID 1)'],
            ['10:24:02', '메모리 할당 142MB'],
            ['10:24:03', 'CPU 코어1 할당'],
          ],
        },
        '#multi': {
          summary: '같은 앱을 두 번 실행하면 프로그램은 하나여도 프로세스는 두 개가 됩니다.',
          memory: ['⚡ 카톡 PID 1', '⚡ 카톡 PID 2'],
          cpu: ['코어1 · 카톡 PID 1', '코어2 · 카톡 PID 2', '코어3 · 대기', '코어4 · 대기'],
          logs: [
            ['10:24:01', '카톡.apk → 프로세스 생성 (PID 1)'],
            ['10:24:06', '카톡.apk 재실행 → 프로세스 생성 (PID 2)'],
            ['10:24:07', '두 프로세스를 코어1·2에 분산 배치'],
          ],
        },
        '#cpu': {
          summary: '프로세서는 실행 중인 프로세스에 계산 시간을 나눠 주는 실제 처리 부품입니다.',
          memory: ['⚡ 카톡 PID 1', '⚡ 메모 PID 2'],
          cpu: ['코어1 · 카톡', '코어2 · 메모', '코어3 · 대기', '코어4 · 대기'],
          logs: [
            ['10:24:01', '카톡 PID 1 준비 완료'],
            ['10:24:08', '메모 PID 2 준비 완료'],
            ['10:24:09', 'CPU가 번갈아 계산 시간 할당'],
          ],
        },
        '#kill': {
          summary: '앱을 종료하면 메모리의 프로세스가 사라지고 CPU 할당도 즉시 해제됩니다.',
          memory: [],
          cpu: ['코어1 · 대기', '코어2 · 대기', '코어3 · 대기', '코어4 · 대기'],
          logs: [
            ['10:24:11', '카톡 PID 1 종료 요청'],
            ['10:24:12', '메모리 회수 완료'],
            ['10:24:13', 'CPU 코어1 대기 상태 복귀'],
          ],
        },
      };

      function render() {
        const hash = scenarioMap[location.hash] ? location.hash : '#launch';
        const scenario = scenarioMap[hash];
        const memoryChips = scenario.memory.length
          ? scenario.memory.map((text) => '<span class="demo-chip proc">' + text + '</span>').join('')
          : '<span class="demo-chip">현재 실행 중인 프로세스 없음</span>';
        const cpuCores = scenario.cpu
          .map((text) => {
            const busy = text.indexOf('대기') === -1 ? ' busy' : '';
            return '<div class="demo-core' + busy + '">' + text + '</div>';
          })
          .join('');
        const logs = scenario.logs
          .map((entry) => '<div><span class="ts">' + entry[0] + '</span>' + entry[1] + '</div>')
          .join('');

        document.getElementById('screen').innerHTML =
          '<div class="demo">' +
          '<h4>📱 카톡 프로세스 시뮬레이터</h4>' +
          '<p class="sub">프로그램 → 프로세스 → 프로세서 흐름을 한 장면씩 확인합니다.</p>' +
          '<div class="demo-tier">' +
          '<p class="demo-tier-label">디스크 (저장)</p>' +
          '<span class="demo-chip">📦 카톡.apk</span>' +
          '<span class="demo-chip">📦 메모.apk</span>' +
          '<span class="demo-chip">📦 사진.apk</span>' +
          '<p class="sub">= 프로그램 (파일 형태)</p>' +
          '</div>' +
          '<div class="demo-arrow">↓ 클릭으로 실행</div>' +
          '<div class="demo-tier active">' +
          '<p class="demo-tier-label">메모리 (실행 중)</p>' +
          memoryChips +
          '<p class="sub">= 프로세스</p>' +
          '</div>' +
          '<div class="demo-arrow">↓ 명령 처리</div>' +
          '<div class="demo-tier">' +
          '<p class="demo-tier-label">CPU (계산)</p>' +
          '<div class="demo-cpu-cores">' + cpuCores + '</div>' +
          '<p class="sub">= 프로세서</p>' +
          '</div>' +
          '<div class="demo-log">' + logs + '</div>' +
          '<p class="caption">▶ ' + scenario.summary + '</p>' +
          '</div>';
      }

      window.addEventListener('hashchange', render);
      render();
    </script>
  </body>
</html>
