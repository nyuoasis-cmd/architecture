<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>전달 방식 비교</title>
    <style>
      :root {
        --bg: #fbfbf9;
        --card: #ffffff;
        --line: #d6d3d1;
        --text: #1f2937;
        --muted: #6b7280;
        --accent: #2563eb;
        --soft: #eff6ff;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; font-family: 'Pretendard Variable', 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); }
      body { overflow: hidden; }
      .demo { height: 100%; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
      h4 { margin: 0; font-size: 14px; }
      .sub { margin: 0; color: var(--muted); line-height: 1.5; font-size: 12px; }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; }
      .chip { border-radius: 999px; padding: 4px 9px; background: var(--soft); color: var(--accent); font-size: 11px; }
      .track { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
      .step { border: 1px solid var(--line); border-radius: 12px; padding: 10px 8px; background: var(--card); text-align: center; font-size: 11px; line-height: 1.5; }
      .step.active { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
      .card { border: 1px solid var(--line); border-radius: 14px; padding: 12px; background: var(--card); line-height: 1.7; font-size: 12px; }
      .note { border-radius: 14px; background: #111827; color: #f9fafb; padding: 10px 12px; font-size: 12px; line-height: 1.6; }
    </style>
  </head>
  <body>
    <div id="screen"></div>
    <script>
      const scenarioMap = {
        '#ip': {
          active: 0,
          chips: ['주소', '라우팅'],
          text: 'IP는 데이터에 목적지 주소를 붙여 어느 방향으로 가야 하는지 알려 줍니다. 배달 주소를 쓰는 단계에 가깝습니다.',
        },
        '#tcp': {
          active: 1,
          chips: ['순서 보장', '재전송'],
          text: 'TCP는 빠진 조각이 없는지 확인하고, 순서를 맞추며, 필요하면 다시 보내 신뢰성을 높입니다.',
        },
        '#udp': {
          active: 2,
          chips: ['낮은 지연', '일부 손실 허용'],
          text: 'UDP는 확인 절차를 줄여 빠르게 보냅니다. 실시간 음성이나 게임처럼 타이밍이 중요할 때 잘 맞습니다.',
        },
        '#mix': {
          active: 3,
          chips: ['역할 분담', '협력'],
          text: '실제 통신에서는 IP가 길을 잡고, 그 위에서 TCP나 UDP가 전달 방식을 정합니다. 서로 다른 층의 규칙이 함께 움직입니다.',
        },
      };

      function render() {
        const hash = scenarioMap[location.hash] ? location.hash : '#ip';
        const scenario = scenarioMap[hash];
        const labels = ['IP', 'TCP', 'UDP', '함께 보기'];
        const steps = labels.map((label, idx) => '<div class="step' + (idx === scenario.active ? ' active' : '') + '">' + label + '</div>').join('');
        const chips = scenario.chips.map((chip) => '<span class="chip">' + chip + '</span>').join('');
        document.getElementById('screen').innerHTML =
          '<div class="demo">' +
          '<h4>전달 방식 비교</h4>' +
          '<p class="sub">주소를 붙이는 규칙과 전달 품질을 정하는 규칙은 같은 층이 아닙니다.</p>' +
          '<div class="track">' + steps + '</div>' +
          '<div class="chips">' + chips + '</div>' +
          '<div class="card">' + scenario.text + '</div>' +
          '<div class="note">▶ IP는 길 찾기, TCP는 확인 배송, UDP는 빠른 방송처럼 떠올리면 차이가 선명해집니다.</div>' +
          '</div>';
      }

      window.addEventListener('hashchange', render);
      render();
    </script>
  </body>
</html>
