<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>웹 연결 보호막</title>
    <style>
      :root {
        --bg: #fffdf7;
        --card: #ffffff;
        --line: #e7e5e4;
        --text: #1c1917;
        --muted: #78716c;
        --accent: #16a34a;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; font-family: 'Pretendard Variable', 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); }
      body { overflow: hidden; }
      .demo { height: 100%; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
      h4 { margin: 0; font-size: 14px; }
      .sub { margin: 0; color: var(--muted); line-height: 1.5; font-size: 12px; }
      .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .box { border: 1px solid var(--line); border-radius: 12px; padding: 10px; background: var(--card); text-align: center; font-size: 11px; line-height: 1.5; }
      .box.active { border-color: var(--accent); background: #f0fdf4; }
      .card { border: 1px solid var(--line); border-radius: 14px; padding: 12px; background: var(--card); font-size: 12px; line-height: 1.7; }
      .shield { border-radius: 14px; padding: 10px 12px; background: #14532d; color: #f0fdf4; font-size: 12px; line-height: 1.6; }
    </style>
  </head>
  <body>
    <div id="screen"></div>
    <script>
      const scenarioMap = {
        '#http': {
          active: 0,
          text: 'HTTP는 브라우저와 서버가 요청과 응답을 주고받는 기본 약속입니다. 하지만 내용 보호는 기본으로 포함하지 않습니다.',
          shield: '자물쇠 없음: 내용이 평문에 가깝게 지나갈 수 있습니다.',
        },
        '#tls': {
          active: 1,
          text: 'HTTPS는 HTTP 위에 TLS를 더해 통신 내용을 암호화합니다. 중간에서 훔쳐봐도 바로 읽기 어렵게 만드는 단계입니다.',
          shield: '보호막 켜짐: 봉인된 상자처럼 통로를 보호합니다.',
        },
        '#cert': {
          active: 2,
          text: '인증서는 지금 연결한 서버가 정말 그 도메인의 주체인지 확인하는 데 쓰입니다. 가짜 사이트 연결 위험을 줄이는 역할입니다.',
          shield: '신원 확인: “정말 이 서버가 맞나?”를 함께 검사합니다.',
        },
        '#full': {
          active: 2,
          text: '실제 HTTPS는 암호화와 인증서 확인이 함께 움직입니다. 같은 웹 요청이라도 보호된 통로 위에서 신뢰할 수 있는 상대와 대화하게 됩니다.',
          shield: '암호화 + 신원 확인: 둘이 함께 있어야 보호가 완성됩니다.',
        },
      };

      function render() {
        const hash = scenarioMap[location.hash] ? location.hash : '#http';
        const scenario = scenarioMap[hash];
        const labels = ['HTTP', 'TLS', '인증서'];
        const row = labels.map((label, idx) => '<div class="box' + (idx === scenario.active ? ' active' : '') + '">' + label + '</div>').join('');
        document.getElementById('screen').innerHTML =
          '<div class="demo">' +
          '<h4>웹 연결 보호막</h4>' +
          '<p class="sub">웹 통신 규칙은 같아도, 그 통로를 어떻게 보호하느냐에 따라 안전성이 크게 달라집니다.</p>' +
          '<div class="row">' + row + '</div>' +
          '<div class="card">' + scenario.text + '</div>' +
          '<div class="shield">▶ ' + scenario.shield + '</div>' +
          '</div>';
      }

      window.addEventListener('hashchange', render);
      render();
    </script>
  </body>
</html>
