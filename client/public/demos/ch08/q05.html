<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>문지기와 터널</title>
    <style>
      :root {
        --bg: #f9fbfb;
        --card: #ffffff;
        --line: #d6d3d1;
        --text: #1f2937;
        --muted: #6b7280;
        --accent: #0f766e;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; font-family: 'Pretendard Variable', 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); }
      body { overflow: hidden; }
      .demo { height: 100%; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
      h4 { margin: 0; font-size: 14px; }
      .sub { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
      .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .gate { border: 1px solid var(--line); border-radius: 12px; padding: 10px 8px; background: var(--card); text-align: center; font-size: 11px; line-height: 1.5; }
      .gate.active { border-color: var(--accent); background: #f0fdfa; }
      .card { border: 1px solid var(--line); border-radius: 14px; padding: 12px; background: var(--card); line-height: 1.7; font-size: 12px; }
      .note { border-radius: 14px; background: #134e4a; color: #f0fdfa; padding: 10px 12px; font-size: 12px; line-height: 1.6; }
    </style>
  </head>
  <body>
    <div id="screen"></div>
    <script>
      const scenarioMap = {
        '#firewall': { active: 0, text: '방화벽은 어떤 포트와 주소의 요청을 통과시킬지 규칙으로 결정합니다. 허가되지 않은 트래픽은 문 앞에서 막습니다.' },
        '#vpn': { active: 1, text: 'VPN은 공용 인터넷 위에 암호화된 통로를 만들어 외부에서도 내부망처럼 안전하게 연결하게 합니다.' },
        '#together': { active: 2, text: '실제 환경에서는 VPN으로 안전하게 들어오게 한 뒤, 내부에서도 방화벽 규칙으로 접근 범위를 더 세밀하게 나누는 경우가 많습니다.' },
        '#risk': { active: 2, text: '둘은 서로 대체재가 아닙니다. 문지기와 보호된 이동 통로가 각각 따로 있어야 방어가 겹쳐집니다.' },
      };

      function render() {
        const hash = scenarioMap[location.hash] ? location.hash : '#firewall';
        const scenario = scenarioMap[hash];
        const labels = ['방화벽', 'VPN', '함께 쓰기'];
        const row = labels.map((label, idx) => '<div class="gate' + (idx === scenario.active ? ' active' : '') + '">' + label + '</div>').join('');
        document.getElementById('screen').innerHTML =
          '<div class="demo">' +
          '<h4>문지기와 터널</h4>' +
          '<p class="sub">보안 장비 이름보다 먼저, 출입 통제와 보호된 통로가 다른 문제라는 점을 보는 것이 중요합니다.</p>' +
          '<div class="row">' + row + '</div>' +
          '<div class="card">' + scenario.text + '</div>' +
          '<div class="note">▶ 방화벽은 “들여보낼까?”, VPN은 “어떻게 안전하게 지나갈까?”를 맡습니다.</div>' +
          '</div>';
      }

      window.addEventListener('hashchange', render);
      render();
    </script>
  </body>
</html>
