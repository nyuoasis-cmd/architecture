<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>구조 분해</title>
    <style>
      :root {
        --bg: #fcfbf8;
        --card: #ffffff;
        --line: #d6d3d1;
        --text: #1c1917;
        --muted: #78716c;
        --accent: #0f766e;
        --soft: #ccfbf1;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; font-family: 'Pretendard Variable', 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); }
      body { overflow: hidden; }
      .demo { height: 100%; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
      h4 { margin: 0; font-size: 14px; }
      .sub { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.5; }
      .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
      .cell { border: 1px solid var(--line); border-radius: 12px; padding: 10px 8px; background: var(--card); text-align: center; font-size: 11px; line-height: 1.5; }
      .cell.active { border-color: var(--accent); background: var(--soft); }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; }
      .chip { border-radius: 999px; padding: 4px 9px; background: var(--soft); color: var(--accent); font-size: 11px; }
      .card { border: 1px solid var(--line); border-radius: 14px; padding: 12px; background: var(--card); font-size: 12px; line-height: 1.7; }
      .note { border-radius: 14px; background: #134e4a; color: #f0fdfa; padding: 10px 12px; font-size: 12px; line-height: 1.6; }
    </style>
  </head>
  <body>
    <div id="screen"></div>
    <script>
      const scenarioMap = {
        '#mono': { active: 0, chips: ['한 배포', '단순 시작'], text: '모놀리식은 화면, 인증, 주문, 결제가 한 프로젝트에 함께 있어 시작과 로컬 개발이 단순합니다.' },
        '#growth': { active: 1, chips: ['무거운 빌드', '전체 영향'], text: '규모가 커지면 작은 수정도 전체 빌드와 배포로 이어져 점점 움직임이 둔해질 수 있습니다.' },
        '#micro': { active: 2, chips: ['독립 배포', '팀 분리'], text: '마이크로서비스는 기능을 여러 서비스로 나눠 각 팀이 더 독립적으로 고치고 배포하게 합니다.' },
        '#tradeoff': { active: 3, chips: ['분산 통신', '운영 복잡도'], text: '대신 네트워크 호출, 데이터 일관성, 관찰성 같은 운영 문제가 새로 커지므로 구조 선택은 팀 역량과 함께 봐야 합니다.' },
      };

      function render() {
        const hash = scenarioMap[location.hash] ? location.hash : '#mono';
        const scene = scenarioMap[hash];
        const labels = ['모놀리식', '성장 통증', '마이크로서비스', '트레이드오프'];
        const cells = labels.map((label, idx) => '<div class="cell' + (idx === scene.active ? ' active' : '') + '">' + label + '</div>').join('');
        const chips = scene.chips.map((chip) => '<span class="chip">' + chip + '</span>').join('');
        document.getElementById('screen').innerHTML =
          '<div class="demo">' +
          '<h4>구조 분해</h4>' +
          '<p class="sub">한집으로 살지, 동을 나눌지의 차이는 코드보다 배포와 운영 방식에서 먼저 드러납니다.</p>' +
          '<div class="grid">' + cells + '</div>' +
          '<div class="chips">' + chips + '</div>' +
          '<div class="card">' + scene.text + '</div>' +
          '<div class="note">▶ 마이크로서비스는 분리 자체가 목적이 아니라, 팀과 배포 흐름을 더 잘 맞추기 위한 선택입니다.</div>' +
          '</div>';
      }

      window.addEventListener('hashchange', render);
      render();
    </script>
  </body>
</html>
