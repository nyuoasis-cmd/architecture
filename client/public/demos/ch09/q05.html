<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>큐 흐름</title>
    <style>
      :root {
        --bg: #fdfcfb;
        --card: #ffffff;
        --line: #d6d3d1;
        --text: #292524;
        --muted: #78716c;
        --accent: #b45309;
        --soft: #fef3c7;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; font-family: 'Pretendard Variable', 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); }
      body { overflow: hidden; }
      .demo { height: 100%; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
      h4 { margin: 0; font-size: 14px; }
      .sub { margin: 0; color: var(--muted); line-height: 1.5; font-size: 12px; }
      .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
      .box { border: 1px solid var(--line); border-radius: 12px; padding: 10px 8px; background: var(--card); text-align: center; font-size: 11px; line-height: 1.5; }
      .box.active { border-color: var(--accent); background: var(--soft); }
      .card { border: 1px solid var(--line); border-radius: 14px; padding: 12px; background: var(--card); font-size: 12px; line-height: 1.7; }
      .note { border-radius: 14px; background: #78350f; color: #fef3c7; padding: 10px 12px; font-size: 12px; line-height: 1.6; }
    </style>
  </head>
  <body>
    <div id="screen"></div>
    <script>
      const scenarioMap = {
        '#request': { active: 0, text: '사용자는 주문 버튼을 누르고, 서버는 핵심 처리만 끝낸 뒤 빠르게 성공 응답을 돌려줄 수 있습니다.' },
        '#enqueue': { active: 1, text: '메일 발송, 추천 갱신, 로그 적재 같은 후속 작업은 메시지 큐에 넣어 나중에 처리할 수 있습니다.' },
        '#worker': { active: 2, text: '워커는 큐에서 작업을 꺼내 처리합니다. 응답 경로와 분리되므로 느린 작업이 사용자 대기를 직접 늘리지 않습니다.' },
        '#burst': { active: 3, text: '작업이 한꺼번에 몰려도 큐가 버퍼처럼 쌓아 두어 시스템이 갑자기 무너지는 것을 완화합니다.' },
      };

      function render() {
        const hash = scenarioMap[location.hash] ? location.hash : '#request';
        const scene = scenarioMap[hash];
        const labels = ['요청', '큐 적재', '워커 처리', '버퍼링'];
        const row = labels.map((label, idx) => '<div class="box' + (idx === scene.active ? ' active' : '') + '">' + label + '</div>').join('');
        document.getElementById('screen').innerHTML =
          '<div class="demo">' +
          '<h4>큐 흐름</h4>' +
          '<p class="sub">메시지 큐는 일을 없애는 도구가 아니라, 무엇을 지금 끝내고 무엇을 뒤로 미룰지 구분하게 해 줍니다.</p>' +
          '<div class="row">' + row + '</div>' +
          '<div class="card">' + scene.text + '</div>' +
          '<div class="note">▶ 큐를 두면 응답성은 좋아지지만, 적체 모니터링과 재시도 정책도 함께 필요해집니다.</div>' +
          '</div>';
      }

      window.addEventListener('hashchange', render);
      render();
    </script>
  </body>
</html>
