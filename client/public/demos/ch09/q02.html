<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>계층 역할</title>
    <style>
      :root {
        --bg: #fffdfa;
        --card: #ffffff;
        --line: #e7e5e4;
        --text: #292524;
        --muted: #78716c;
        --accent: #c2410c;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; font-family: 'Pretendard Variable', 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); }
      body { overflow: hidden; }
      .demo { height: 100%; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
      h4 { margin: 0; font-size: 14px; }
      .sub { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.5; }
      .stack { display: grid; gap: 8px; }
      .layer { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--card); font-size: 11px; line-height: 1.5; }
      .layer.active { border-color: var(--accent); background: #fff7ed; }
      .card { border: 1px solid var(--line); border-radius: 14px; padding: 12px; background: var(--card); font-size: 12px; line-height: 1.7; }
      .note { border-radius: 14px; background: #9a3412; color: #fff7ed; padding: 10px 12px; font-size: 12px; line-height: 1.6; }
    </style>
  </head>
  <body>
    <div id="screen"></div>
    <script>
      const scenarioMap = {
        '#ui': { active: 0, text: '프레젠테이션 계층은 입력을 받고 화면을 그리는 역할에 집중합니다. 버튼, 폼, 응답 표현이 여기에 모입니다.' },
        '#service': { active: 1, text: '서비스 계층은 할인 규칙, 승인 절차, 상태 전이처럼 비즈니스 판단을 모읍니다. 화면 세부사항과는 거리를 둡니다.' },
        '#data': { active: 2, text: '데이터 접근 계층은 DB나 외부 API와 통신합니다. 저장 기술이 바뀌어도 윗계층 영향이 덜 가도록 경계를 만듭니다.' },
        '#flow': { active: 1, text: '요청은 보통 화면에서 시작해 서비스 규칙을 거쳐 데이터 접근으로 내려갑니다. 각 층의 책임이 분명할수록 변경 범위가 좁아집니다.' },
      };

      function render() {
        const hash = scenarioMap[location.hash] ? location.hash : '#ui';
        const scene = scenarioMap[hash];
        const labels = ['화면 계층', '서비스 계층', '데이터 계층'];
        const stack = labels.map((label, idx) => '<div class="layer' + (idx === scene.active ? ' active' : '') + '">' + label + '</div>').join('');
        document.getElementById('screen').innerHTML =
          '<div class="demo">' +
          '<h4>계층 역할</h4>' +
          '<p class="sub">레이어드 구조의 포인트는 층 수보다, 무엇이 어디에 살아야 하는지 경계를 세우는 데 있습니다.</p>' +
          '<div class="stack">' + stack + '</div>' +
          '<div class="card">' + scene.text + '</div>' +
          '<div class="note">▶ 화면 수정이 저장 규칙을 흔들지 않게 만드는 것이 레이어드 아키텍처의 첫 번째 효용입니다.</div>' +
          '</div>';
      }

      window.addEventListener('hashchange', render);
      render();
    </script>
  </body>
</html>
