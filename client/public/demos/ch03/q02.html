<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Red-Green-Refactor 사이클</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --card: #fff;
        --text: #172033;
        --muted: #667085;
        --border: #d8e1eb;
        --accent: #2563eb;
        --accent-soft: #dbeafe;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; background: var(--bg); color: var(--text); font-family: 'Pretendard Variable', 'Noto Sans KR', sans-serif; }
      body { overflow: hidden; }
      #app { width: 100%; height: 100%; overflow-y: auto; }
      .screen { min-height: 100%; padding: 16px 14px 22px; }
      .hero, .cycle, .log { border: 1px solid var(--border); border-radius: 18px; background: var(--card); }
      .hero { padding: 16px; background: linear-gradient(135deg, #dbeafe, #ffffff); }
      .eyebrow { margin: 0 0 6px; font-size: 11px; color: var(--muted); }
      h1 { margin: 0; font-size: 18px; }
      .summary { margin: 8px 0 0; font-size: 12px; line-height: 1.7; }
      .cycle { margin-top: 12px; padding: 14px; }
      .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .step { padding: 12px 10px; border: 1px solid var(--border); border-radius: 16px; background: #fff; text-align: center; }
      .step.active { border-color: var(--accent); background: var(--accent-soft); }
      .step h2 { margin: 0 0 6px; font-size: 12px; }
      .step p { margin: 0; font-size: 10px; line-height: 1.6; color: var(--muted); }
      .loop { margin-top: 10px; padding: 10px 12px; border-radius: 14px; background: #eff6ff; font-size: 11px; line-height: 1.7; }
      .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
      .chip { padding: 6px 10px; border-radius: 999px; border: 1px solid var(--border); background: #fff; font-size: 11px; }
      .chip.hot { border-color: #93c5fd; background: #eff6ff; color: #1d4ed8; }
      .log { margin-top: 12px; padding: 12px 14px; background: #0f172a; color: #f8fafc; }
      .line { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; line-height: 1.7; }
      .time { color: #93c5fd; margin-right: 6px; }
      @media (max-width: 375px) { .steps { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      const scenes = {
        '#red': {
          title: 'Red — 실패를 먼저 본다',
          summary: '원하는 동작을 테스트로 먼저 적어 목표를 선명하게 만듭니다.',
          active: 0,
          chips: ['실패 허용', '요구사항 명확화', '출발점', '빈칸 확인'],
          hot: 0,
          loop: '아직 기능이 없으니 실패가 정상이다. 무엇을 만들어야 하는지가 먼저 드러난다.',
          logs: [['11:10:01', 'expect(totalPrice(2, 5000)).toBe(10000)'], ['11:10:02', 'ReferenceError: totalPrice is not defined'], ['11:10:03', '목표 동작 확정']],
        },
        '#green': {
          title: 'Green — 최소 구현으로 통과',
          summary: '테스트를 겨우 통과할 만큼만 구현해 과한 설계를 막습니다.',
          active: 1,
          chips: ['최소 구현', '빠른 통과', '작은 성공', '과잉 설계 방지'],
          hot: 1,
          loop: '완벽함보다 통과가 우선이다. 지금 약속한 행동을 맞추는 데 집중한다.',
          logs: [['11:10:04', 'function totalPrice(q, p) { return q * p; }'], ['11:10:05', '1 passed, 0 failed'], ['11:10:06', '다음 개선 후보 기록']],
        },
        '#refactor': {
          title: 'Refactor — 구조를 다듬는다',
          summary: '동작은 유지한 채 이름, 중복, 구조를 정리해 다음 변경을 쉽게 만듭니다.',
          active: 2,
          chips: ['중복 제거', '이름 개선', '구조 정리', '안전망 유지'],
          hot: 2,
          loop: '테스트가 지켜보고 있으니, 겉보기 동작을 깨뜨리지 않고 내부를 정리할 수 있다.',
          logs: [['11:10:07', 'discount 계산 함수 분리'], ['11:10:08', '변수명 orderTotal로 변경'], ['11:10:09', 'tests still green']],
        },
        '#loop': {
          title: 'Loop — 다시 Red로 돌아간다',
          summary: '작은 기능 하나가 끝나면 바로 다음 요구를 향해 같은 리듬을 반복합니다.',
          active: 1,
          chips: ['작게 반복', '설계 리듬', '확장 용이', '예측 가능'],
          hot: 3,
          loop: 'TDD는 한 번의 의식이 아니라 반복되는 작업 박자다. 작은 약속을 세우고 통과시키며 키워 간다.',
          logs: [['11:10:10', '쿠폰 기능 테스트 추가'], ['11:10:11', '다시 실패 확인'], ['11:10:12', '새 사이클 시작']],
        },
      };

      function render() {
        const hash = scenes[location.hash] ? location.hash : '#red';
        const scene = scenes[hash];
        const steps = [
          ['Red', '실패하는 테스트'],
          ['Green', '최소 구현 통과'],
          ['Refactor', '구조 정리'],
        ].map((step, index) => '<div class="step' + (scene.active === index ? ' active' : '') + '"><h2>' + step[0] + '</h2><p>' + step[1] + '</p></div>').join('');
        const chips = scene.chips.map((chip, index) => '<span class="chip' + (scene.hot === index ? ' hot' : '') + '">' + chip + '</span>').join('');
        const logs = scene.logs.map((row) => '<div class="line"><span class="time">' + row[0] + '</span>' + row[1] + '</div>').join('');
        document.getElementById('app').innerHTML =
          '<div class="screen"><section class="hero"><p class="eyebrow">TDD 사이클</p><h1>' + scene.title + '</h1><p class="summary">' + scene.summary + '</p></section>' +
          '<section class="cycle"><div class="steps">' + steps + '</div><div class="loop">' + scene.loop + '</div><div class="chips">' + chips + '</div></section>' +
          '<section class="log"><p class="eyebrow" style="color:#bfdbfe;">실행 로그</p>' + logs + '</section></div>';
      }
      window.addEventListener('hashchange', render);
      render();
    </script>
  </body>
</html>
