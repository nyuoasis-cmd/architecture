<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CI 자동 검증 게이트</title>
    <style>
      :root {
        --bg: #f3f8f6;
        --card: #fff;
        --text: #17312a;
        --muted: #5f766f;
        --border: #d3e3dc;
        --accent: #0f766e;
        --accent-soft: #ccfbf1;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; background: var(--bg); color: var(--text); font-family: 'Pretendard Variable', 'Noto Sans KR', sans-serif; }
      body { overflow: hidden; }
      #app { width: 100%; height: 100%; overflow-y: auto; }
      .screen { min-height: 100%; padding: 16px 14px 22px; }
      .hero, .pipeline, .log { border: 1px solid var(--border); border-radius: 18px; background: var(--card); }
      .hero { padding: 16px; background: linear-gradient(135deg, #ccfbf1, #ffffff); }
      .eyebrow { margin: 0 0 6px; font-size: 11px; color: var(--muted); }
      h1 { margin: 0; font-size: 18px; }
      .summary { margin: 8px 0 0; font-size: 12px; line-height: 1.7; }
      .pipeline { margin-top: 12px; padding: 14px; }
      .rail { display: grid; gap: 8px; }
      .node { padding: 12px; border: 1px solid var(--border); border-radius: 16px; background: #fff; }
      .node.active { border-color: var(--accent); background: var(--accent-soft); }
      .node h2 { margin: 0 0 4px; font-size: 12px; }
      .node p { margin: 0; font-size: 11px; line-height: 1.6; color: var(--muted); }
      .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
      .chip { padding: 6px 10px; border-radius: 999px; border: 1px solid var(--border); background: #fff; font-size: 11px; }
      .chip.hot { border-color: #5eead4; background: var(--accent-soft); color: #115e59; }
      .log { margin-top: 12px; padding: 12px 14px; background: #0f172a; color: #f8fafc; }
      .line { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; line-height: 1.7; }
      .time { color: #5eead4; margin-right: 6px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      const scenes = {
        '#commit': {
          title: '커밋 감지',
          summary: '개발자가 변경을 올리면 파이프라인이 자동으로 시작됩니다.',
          active: 0,
          chips: ['push 감지', 'PR 이벤트', '자동 시작', '수작업 제거'],
          hot: 0,
          logs: [['12:20:01', 'push event received'], ['12:20:02', 'workflow queued'], ['12:20:03', 'runner allocated']],
        },
        '#build': {
          title: '빌드 실행',
          summary: '코드가 실제 산출물로 묶일 수 있는지 먼저 확인합니다.',
          active: 1,
          chips: ['의존성 설치', '타입 검사', '번들 생성', '환경 확인'],
          hot: 1,
          logs: [['12:20:04', 'npm ci complete'], ['12:20:05', 'vite build started'], ['12:20:06', 'artifact ready']],
        },
        '#test': {
          title: '테스트 점검',
          summary: '자동화된 테스트가 통과해야 다음 단계로 넘길 수 있습니다.',
          active: 2,
          chips: ['unit', 'integration', 'lint', 'gating'],
          hot: 3,
          logs: [['12:20:07', '42 tests running'], ['12:20:08', '1 failure in payment flow'], ['12:20:09', 'pipeline marked failed']],
        },
        '#report': {
          title: '결과 리포트',
          summary: '성공과 실패를 기록해 누가 봐도 같은 상태를 확인하게 합니다.',
          active: 3,
          chips: ['status badge', 'review gate', 'artifact link', 'failure trace'],
          hot: 2,
          logs: [['12:20:10', 'checks summary published'], ['12:20:11', 'review blocked until fix'], ['12:20:12', 'logs attached to PR']],
        },
      };

      function render() {
        const hash = scenes[location.hash] ? location.hash : '#commit';
        const scene = scenes[hash];
        const nodes = [
          ['커밋', '변경 감지'],
          ['빌드', '산출물 확인'],
          ['테스트', '자동 검증'],
          ['리포트', '상태 공유'],
        ].map((node, index) => '<div class="node' + (scene.active === index ? ' active' : '') + '"><h2>' + node[0] + '</h2><p>' + node[1] + '</p></div>').join('');
        const chips = scene.chips.map((chip, index) => '<span class="chip' + (scene.hot === index ? ' hot' : '') + '">' + chip + '</span>').join('');
        const logs = scene.logs.map((row) => '<div class="line"><span class="time">' + row[0] + '</span>' + row[1] + '</div>').join('');
        document.getElementById('app').innerHTML =
          '<div class="screen"><section class="hero"><p class="eyebrow">CI 파이프라인</p><h1>' + scene.title + '</h1><p class="summary">' + scene.summary + '</p></section>' +
          '<section class="pipeline"><div class="rail">' + nodes + '</div><div class="chips">' + chips + '</div></section>' +
          '<section class="log"><p class="eyebrow" style="color:#99f6e4;">파이프라인 로그</p>' + logs + '</section></div>';
      }
      window.addEventListener('hashchange', render);
      render();
    </script>
  </body>
</html>
