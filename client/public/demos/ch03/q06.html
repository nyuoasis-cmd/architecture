<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>모니터링 대시보드 시뮬레이터</title>
    <style>
      :root {
        --bg: #f4f8f7;
        --card: #fff;
        --text: #18312d;
        --muted: #637a76;
        --border: #d4e3df;
        --accent: #059669;
        --accent-soft: #d1fae5;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; background: var(--bg); color: var(--text); font-family: 'Pretendard Variable', 'Noto Sans KR', sans-serif; }
      body { overflow: hidden; }
      #app { width: 100%; height: 100%; overflow-y: auto; }
      .screen { min-height: 100%; padding: 16px 14px 22px; }
      .hero, .metrics, .log { border: 1px solid var(--border); border-radius: 18px; background: var(--card); }
      .hero { padding: 16px; background: linear-gradient(135deg, #d1fae5, #ffffff); }
      .eyebrow { margin: 0 0 6px; font-size: 11px; color: var(--muted); }
      h1 { margin: 0; font-size: 18px; }
      .summary { margin: 8px 0 0; font-size: 12px; line-height: 1.7; }
      .metrics { margin-top: 12px; padding: 14px; display: grid; gap: 8px; }
      .metric { padding: 12px; border: 1px solid var(--border); border-radius: 16px; background: #fff; }
      .metric.active { border-color: var(--accent); background: var(--accent-soft); }
      .metric h2 { margin: 0; font-size: 12px; }
      .metric p { margin: 6px 0 0; font-size: 11px; line-height: 1.6; color: var(--muted); }
      .metric strong { display: block; margin-top: 6px; font-size: 18px; }
      .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 2px; }
      .chip { padding: 6px 10px; border-radius: 999px; border: 1px solid var(--border); background: #fff; font-size: 11px; }
      .chip.hot { border-color: #6ee7b7; background: var(--accent-soft); color: #047857; }
      .log { margin-top: 12px; padding: 12px 14px; background: #0f172a; color: #f8fafc; }
      .line { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; line-height: 1.7; }
      .time { color: #6ee7b7; margin-right: 6px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      const scenes = {
        '#traffic': {
          title: '요청 수를 본다',
          summary: '트래픽이 갑자기 늘면 확장이나 병목 점검이 필요해질 수 있습니다.',
          active: 0,
          values: ['1,280 rpm', '190 ms', '0.3%', '정상'],
          chips: ['트래픽 패턴', '피크 시간', '용량 계획', '기준선'],
          hot: 0,
          logs: [['15:00:01', 'requests/min rising'], ['15:00:02', 'autoscale threshold approaching'], ['15:00:03', 'capacity review opened']],
        },
        '#latency': {
          title: '지연 시간을 본다',
          summary: '응답이 늦어지면 기능은 살아 있어도 사용자 체감 품질이 나빠집니다.',
          active: 1,
          values: ['1,050 rpm', '420 ms', '0.4%', '주의'],
          chips: ['p95 응답', '병목 탐지', '캐시 점검', 'DB 지연'],
          hot: 1,
          logs: [['15:00:04', 'p95 latency above target'], ['15:00:05', 'slow query suspected'], ['15:00:06', 'cache warm-up triggered']],
        },
        '#error': {
          title: '에러율을 본다',
          summary: '성공 비율이 떨어지면 바로 장애와 연결될 수 있어 민감하게 봐야 합니다.',
          active: 2,
          values: ['980 rpm', '230 ms', '4.8%', '위험'],
          chips: ['5xx 비율', '실패 응답', '릴리스 영향', 'SLO 근접'],
          hot: 2,
          logs: [['15:00:07', 'error rate exceeded 4%'], ['15:00:08', 'release correlation found'], ['15:00:09', 'rollback candidate prepared']],
        },
        '#alert': {
          title: '알림 트리거를 건다',
          summary: '지금 행동이 필요한 순간에만 사람을 깨워야 경고가 무뎌지지 않습니다.',
          active: 3,
          values: ['990 rpm', '240 ms', '5.2%', '알림 발송'],
          chips: ['행동 기준', '온콜 호출', '오탐 줄이기', 'SLO 보호'],
          hot: 3,
          logs: [['15:00:10', 'error rate > 5% for 5m'], ['15:00:11', 'on-call notified'], ['15:00:12', 'incident channel opened']],
        },
      };

      function render() {
        const hash = scenes[location.hash] ? location.hash : '#traffic';
        const scene = scenes[hash];
        const labels = ['요청 수', '지연 시간', '에러율', '상태'];
        const metrics = labels.map((label, index) => '<div class="metric' + (scene.active === index ? ' active' : '') + '"><h2>' + label + '</h2><strong>' + scene.values[index] + '</strong></div>').join('');
        const chips = scene.chips.map((chip, index) => '<span class="chip' + (scene.hot === index ? ' hot' : '') + '">' + chip + '</span>').join('');
        const logs = scene.logs.map((row) => '<div class="line"><span class="time">' + row[0] + '</span>' + row[1] + '</div>').join('');
        document.getElementById('app').innerHTML =
          '<div class="screen"><section class="hero"><p class="eyebrow">운영 감시</p><h1>' + scene.title + '</h1><p class="summary">' + scene.summary + '</p></section>' +
          '<section class="metrics">' + metrics + '<div class="chips">' + chips + '</div></section>' +
          '<section class="log"><p class="eyebrow" style="color:#a7f3d0;">알림 로그</p>' + logs + '</section></div>';
      }
      window.addEventListener('hashchange', render);
      render();
    </script>
  </body>
</html>
