<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>복구 훈련 타이머</title>
    <style>
      :root { --bg:#f3f7f8; --card:#ffffff; --text:#1f2d33; --muted:#61727b; --border:#d7e4e8; --accent:#0f766e; --soft:#ccfbf1; }
      * { box-sizing:border-box; }
      html, body { margin:0; width:100%; height:100%; background:var(--bg); color:var(--text); font-family:'Pretendard Variable','Noto Sans KR',sans-serif; }
      body { overflow:hidden; }
      #app { width:100%; height:100%; overflow-y:auto; }
      .screen { min-height:100%; padding:16px 14px 22px; }
      .hero, .panel, .log { border:1px solid var(--border); border-radius:18px; background:var(--card); }
      .hero { padding:16px; background:linear-gradient(135deg,#ccfbf1,#ffffff); }
      .eyebrow { margin:0 0 6px; font-size:11px; color:var(--muted); }
      h1 { margin:0; font-size:18px; }
      .summary { margin:8px 0 0; font-size:12px; line-height:1.7; }
      .panel { margin-top:12px; padding:14px; display:grid; gap:10px; }
      .metric { padding:12px; border:1px solid var(--border); border-radius:14px; background:#fff; }
      .metric.active { border-color:var(--accent); background:var(--soft); }
      .metric strong { display:block; font-size:12px; }
      .metric span { display:block; margin-top:4px; font-size:11px; color:var(--muted); line-height:1.6; }
      .chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
      .chip { padding:6px 10px; border:1px solid var(--border); border-radius:999px; background:#fff; font-size:11px; }
      .chip.hot { border-color:#5eead4; background:var(--soft); color:#115e59; }
      .log { margin-top:12px; padding:12px 14px; background:#111827; color:#f8fafc; }
      .line { font-family:'JetBrains Mono',ui-monospace,monospace; font-size:10px; line-height:1.7; }
      .time { color:#5eead4; margin-right:6px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      const scenes = {
        '#backup': { title:'백업 찍기 — 사본을 남긴다', summary:'정기적으로 데이터를 복사해 두어 사고 때 돌아갈 출발점을 만듭니다.', active:0, hot:0, chips:['사본 생성', '주기 설정', '보관 위치', '자동화'], logs:[['16:30:01','snapshot created'],['16:30:02','retention 7 days'],['16:30:03','backup verified']] },
        '#rpo': { title:'RPO — 얼마나 최근까지 살릴까', summary:'어디까지의 데이터 손실을 감수할지 목표를 정하는 값입니다.', active:1, hot:1, chips:['손실 허용치', '백업 간격', '복제 전략', '비즈니스 기준'], logs:[['16:30:04','target RPO: 15m'],['16:30:05','replication enabled'],['16:30:06','acceptable loss window set']] },
        '#rto': { title:'RTO — 얼마나 빨리 돌아올까', summary:'서비스 중단을 얼마나 길게 허용할지 목표 시간을 정합니다.', active:2, hot:2, chips:['복구 시간', '우선순위', '절차 속도', '가동 재개'], logs:[['16:30:07','target RTO: 30m'],['16:30:08','restore sequence prepared'],['16:30:09','service warm-up planned']] },
        '#drill': { title:'복구 훈련 — 문서가 아니라 실행 가능성 점검', summary:'실제 장애처럼 절차를 따라 해 봐야 복구 계획의 빈틈을 찾을 수 있습니다.', active:3, hot:3, chips:['리허설', '역할 분담', '실측 시간', '개선 포인트'], logs:[['16:30:10','drill started'],['16:30:11','restore slower than target'],['16:30:12','playbook updated']] },
      };
      function render() {
        const scene = scenes[scenes[location.hash] ? location.hash : '#backup'];
        const metrics = [
          ['Backup', '사본 만들기'],
          ['RPO', '손실 허용치'],
          ['RTO', '복구 시간 목표'],
          ['Drill', '실전 연습'],
        ].map((item, index) => '<div class="metric' + (scene.active === index ? ' active' : '') + '"><strong>' + item[0] + '</strong><span>' + (index === scene.active ? scene.summary : item[1]) + '</span></div>').join('');
        const chips = scene.chips.map((chip, index) => '<span class="chip' + (scene.hot === index ? ' hot' : '') + '">' + chip + '</span>').join('');
        const logs = scene.logs.map((row) => '<div class="line"><span class="time">' + row[0] + '</span>' + row[1] + '</div>').join('');
        document.getElementById('app').innerHTML = '<div class="screen"><section class="hero"><p class="eyebrow">장애 대비 설계</p><h1>' + scene.title + '</h1><p class="summary">' + scene.summary + '</p></section><section class="panel">' + metrics + '<div class="chips">' + chips + '</div></section><section class="log"><p class="eyebrow" style="color:#99f6e4;">복구 연습 로그</p>' + logs + '</section></div>';
      }
      window.addEventListener('hashchange', render);
      render();
    </script>
  </body>
</html>
