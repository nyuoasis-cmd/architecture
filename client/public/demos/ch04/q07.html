<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>왜곡 없는 차트 스튜디오</title>
    <style>
      :root { --bg:#f7f4fb; --card:#fff; --text:#2a1f36; --muted:#736681; --border:#e5d9f0; --accent:#9333ea; --soft:#f3e8ff; }
      * { box-sizing:border-box; }
      html, body { margin:0; width:100%; height:100%; background:var(--bg); color:var(--text); font-family:'Pretendard Variable','Noto Sans KR',sans-serif; }
      body { overflow:hidden; }
      #app { width:100%; height:100%; overflow-y:auto; }
      .screen { min-height:100%; padding:16px 14px 22px; }
      .hero, .stage, .log { border:1px solid var(--border); border-radius:18px; background:var(--card); }
      .hero { padding:16px; background:linear-gradient(135deg,#f3e8ff,#ffffff); }
      .eyebrow { margin:0 0 6px; font-size:11px; color:var(--muted); }
      h1 { margin:0; font-size:18px; }
      .summary { margin:8px 0 0; font-size:12px; line-height:1.7; }
      .stage { margin-top:12px; padding:14px; display:grid; gap:10px; }
      .panel { padding:12px; border:1px solid var(--border); border-radius:14px; background:#fff; }
      .panel.active { border-color:var(--accent); background:var(--soft); }
      .bars { display:flex; align-items:flex-end; gap:8px; height:54px; margin-top:8px; }
      .bar { flex:1; border-radius:8px 8px 0 0; background:#d8b4fe; }
      .bar.hot { background:#9333ea; }
      .chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
      .chip { padding:6px 10px; border:1px solid var(--border); border-radius:999px; background:#fff; font-size:11px; }
      .chip.hot { border-color:#d8b4fe; background:var(--soft); color:#6b21a8; }
      .log { margin-top:12px; padding:12px 14px; background:#111827; color:#f8fafc; }
      .line { font-family:'JetBrains Mono',ui-monospace,monospace; font-size:10px; line-height:1.7; }
      .time { color:#d8b4fe; margin-right:6px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      const scenes = {
        '#goal': { title:'질문 먼저 — 무엇을 비교하려는가', summary:'좋은 시각화는 차트 모양보다 먼저 답하려는 질문을 분명히 합니다.', active:0, hot:0, chips:['질문 정의', '비교 대상', '핵심 메시지', '독자 관점'], bars:[24,32,46], logs:[['17:40:01','question selected: monthly sales trend'],['17:40:02','audience: manager'],['17:40:03','chart goal clarified']] },
        '#chart': { title:'차트 선택 — 목적에 맞는 표현', summary:'시간 흐름은 선, 크기 비교는 막대처럼 질문에 맞는 형식을 골라야 합니다.', active:1, hot:1, chips:['선 그래프', '막대그래프', '산점도', '적절한 선택'], bars:[18,38,42], logs:[['17:40:04','trend -> line'],['17:40:05','category compare -> bar'],['17:40:06','correlation -> scatter']] },
        '#axis': { title:'축 점검 — 작은 차이를 과장하지 않는다', summary:'축을 중간부터 자르거나 단위를 숨기면 숫자보다 인상이 먼저 왜곡됩니다.', active:2, hot:2, chips:['축 시작점', '단위 표기', '왜곡 방지', '정직한 비교'], bars:[34,36,38], logs:[['17:40:07','axis starts at zero'],['17:40:08','unit labeled'],['17:40:09','distortion risk reduced']] },
        '#focus': { title:'장식 줄이기 — 데이터가 주인공', summary:'과한 색과 그림자보다 핵심 한두 요소만 강조해야 패턴이 더 잘 보입니다.', active:3, hot:3, chips:['장식 절제', '핵심 강조', '읽기 쉬움', '시선 집중'], bars:[22,28,48], logs:[['17:40:10','3D effect removed'],['17:40:11','one highlight kept'],['17:40:12','message easier to read']] },
      };
      function render() {
        const scene = scenes[scenes[location.hash] ? location.hash : '#goal'];
        const panels = [
          ['질문', '무엇을 보여 줄까'],
          ['차트', '무슨 형식을 쓸까'],
          ['축', '왜곡은 없는가'],
          ['장식', '핵심이 보이는가'],
        ].map((item, index) => '<div class="panel' + (scene.active === index ? ' active' : '') + '"><strong>' + item[0] + '</strong><div style="font-size:11px;color:var(--muted);margin-top:4px;">' + (index === scene.active ? scene.summary : item[1]) + '</div><div class="bars">' + scene.bars.map((height, barIndex) => '<div class="bar' + (barIndex === 2 ? ' hot' : '') + '" style="height:' + height + 'px"></div>').join('') + '</div></div>').join('');
        const chips = scene.chips.map((chip, index) => '<span class="chip' + (scene.hot === index ? ' hot' : '') + '">' + chip + '</span>').join('');
        const logs = scene.logs.map((row) => '<div class="line"><span class="time">' + row[0] + '</span>' + row[1] + '</div>').join('');
        document.getElementById('app').innerHTML = '<div class="screen"><section class="hero"><p class="eyebrow">시각화 원칙</p><h1>' + scene.title + '</h1><p class="summary">' + scene.summary + '</p></section><section class="stage">' + panels + '<div class="chips">' + chips + '</div></section><section class="log"><p class="eyebrow" style="color:#e9d5ff;">디자인 로그</p>' + logs + '</section></div>';
      }
      window.addEventListener('hashchange', render);
      render();
    </script>
  </body>
</html>
