<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>정규화 전후 장부</title>
    <style>
      :root { --bg:#f7f6fb; --card:#fff; --text:#231f35; --muted:#6b6680; --border:#ddd8ef; --accent:#7c3aed; --soft:#ede9fe; }
      * { box-sizing:border-box; }
      html, body { margin:0; width:100%; height:100%; background:var(--bg); color:var(--text); font-family:'Pretendard Variable','Noto Sans KR',sans-serif; }
      body { overflow:hidden; }
      #app { width:100%; height:100%; overflow-y:auto; }
      .screen { min-height:100%; padding:16px 14px 22px; }
      .hero, .tables, .note { border:1px solid var(--border); border-radius:18px; background:var(--card); }
      .hero { padding:16px; background:linear-gradient(135deg,#f3e8ff,#ffffff); }
      .eyebrow { margin:0 0 6px; font-size:11px; color:var(--muted); }
      h1 { margin:0; font-size:18px; }
      .summary { margin:8px 0 0; font-size:12px; line-height:1.7; }
      .tables { margin-top:12px; padding:14px; display:grid; gap:10px; }
      .table { padding:12px; border:1px solid var(--border); border-radius:14px; background:#fff; }
      .table.active { border-color:var(--accent); background:var(--soft); }
      .row { font-size:11px; line-height:1.6; color:var(--muted); margin-top:6px; }
      .chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
      .chip { padding:6px 10px; border:1px solid var(--border); border-radius:999px; background:#fff; font-size:11px; }
      .chip.hot { border-color:#c4b5fd; background:var(--soft); color:#5b21b6; }
      .note { margin-top:12px; padding:12px 14px; background:#111827; color:#f8fafc; }
      .line { font-family:'JetBrains Mono',ui-monospace,monospace; font-size:10px; line-height:1.7; }
      .time { color:#c4b5fd; margin-right:6px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      const scenes = {
        '#dup': { title:'중복 장부 — 같은 정보가 여러 줄에 반복', summary:'주문마다 고객 주소를 함께 적으면 처음엔 편해 보여도 수정 포인트가 늘어납니다.', active:0, hot:0, chips:['반복 값', '여러 줄 수정', '혼선 시작', '중복 비용'], rows:['order1 | mina | seoul','order2 | mina | seoul','order3 | mina | seoul'], logs:[['12:10:01','address repeated x3'],['12:10:02','same customer duplicated'],['12:10:03','maintenance risk rising']] },
        '#update': { title:'수정 혼선 — 한 줄만 고치면 일관성이 깨진다', summary:'주소가 바뀌었는데 일부 행만 수정되면 같은 고객이 두 주소를 가진 것처럼 보입니다.', active:0, hot:1, chips:['수정 이상', '일관성 붕괴', '누락 위험', '검증 필요'], rows:['order1 | mina | busan','order2 | mina | seoul','order3 | mina | seoul'], logs:[['12:10:04','order1 updated'],['12:10:05','order2 stale'],['12:10:06','conflict detected']] },
        '#split': { title:'테이블 분리 — 고객과 주문을 나눠 관리', summary:'공통 정보는 고객 테이블에 한 번만 두고 주문은 고객 번호로 연결합니다.', active:1, hot:2, chips:['고객 테이블', '주문 테이블', '연결 키', '중복 감소'], rows:['customers: C1 | mina | busan','orders: O1 | C1 | notebook','orders: O2 | C1 | pencil'], logs:[['12:10:07','customer row updated once'],['12:10:08','orders stay linked'],['12:10:09','consistency improved']] },
        '#tradeoff': { title:'조회와 균형 — 나누면 합치는 비용도 생긴다', summary:'정규화는 안전하지만, 읽을 때는 다시 연결하는 과정이 필요하므로 균형이 중요합니다.', active:1, hot:3, chips:['join 필요', '안전성', '조회 비용', '균형 설계'], rows:['query: orders join customers','benefit: less duplication','cost: more joins'], logs:[['12:10:10','query joined tables'],['12:10:11','fewer update bugs'],['12:10:12','read path slightly longer']] },
      };
      function render() {
        const scene = scenes[scenes[location.hash] ? location.hash : '#dup'];
        const tables = ['주문 중심 장부','분리된 설계'].map((label, index) => '<div class="table' + (scene.active === index ? ' active' : '') + '"><strong>' + label + '</strong>' + scene.rows.map((row) => '<div class="row">' + row + '</div>').join('') + '</div>').join('');
        const chips = scene.chips.map((chip, index) => '<span class="chip' + (scene.hot === index ? ' hot' : '') + '">' + chip + '</span>').join('');
        const logs = scene.logs.map((row) => '<div class="line"><span class="time">' + row[0] + '</span>' + row[1] + '</div>').join('');
        document.getElementById('app').innerHTML = '<div class="screen"><section class="hero"><p class="eyebrow">정규화 시뮬레이션</p><h1>' + scene.title + '</h1><p class="summary">' + scene.summary + '</p></section><section class="tables">' + tables + '<div class="chips">' + chips + '</div></section><section class="note"><p class="eyebrow" style="color:#ddd6fe;">장부 변경 로그</p>' + logs + '</section></div>';
      }
      window.addEventListener('hashchange', render);
      render();
    </script>
  </body>
</html>
