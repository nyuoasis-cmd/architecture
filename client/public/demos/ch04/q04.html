<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>색인 카드 검색대</title>
    <style>
      :root { --bg:#f3f8f4; --card:#fff; --text:#1d2a22; --muted:#647067; --border:#d7e5db; --accent:#15803d; --soft:#dcfce7; }
      * { box-sizing:border-box; }
      html, body { margin:0; width:100%; height:100%; background:var(--bg); color:var(--text); font-family:'Pretendard Variable','Noto Sans KR',sans-serif; }
      body { overflow:hidden; }
      #app { width:100%; height:100%; overflow-y:auto; }
      .screen { min-height:100%; padding:16px 14px 22px; }
      .hero, .cards, .log { border:1px solid var(--border); border-radius:18px; background:var(--card); }
      .hero { padding:16px; background:linear-gradient(135deg,#dcfce7,#ffffff); }
      .eyebrow { margin:0 0 6px; font-size:11px; color:var(--muted); }
      h1 { margin:0; font-size:18px; }
      .summary { margin:8px 0 0; font-size:12px; line-height:1.7; }
      .cards { margin-top:12px; padding:14px; display:grid; gap:10px; }
      .card { padding:12px; border:1px solid var(--border); border-radius:14px; background:#fff; }
      .card.active { border-color:var(--accent); background:var(--soft); }
      .progress { margin-top:8px; height:8px; border-radius:999px; background:#edf7f0; overflow:hidden; }
      .fill { height:100%; background:linear-gradient(90deg,#22c55e,#15803d); }
      .chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
      .chip { padding:6px 10px; border:1px solid var(--border); border-radius:999px; background:#fff; font-size:11px; }
      .chip.hot { border-color:#86efac; background:var(--soft); color:#166534; }
      .log { margin-top:12px; padding:12px 14px; background:#111827; color:#f8fafc; }
      .line { font-family:'JetBrains Mono',ui-monospace,monospace; font-size:10px; line-height:1.7; }
      .time { color:#86efac; margin-right:6px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      const scenes = {
        '#scan': { title:'전체 훑기 — 모든 페이지를 손으로 넘긴다', summary:'인덱스가 없으면 조건에 맞는 값을 찾기 위해 많은 행을 차례대로 읽어야 합니다.', active:0, progress:92, hot:0, chips:['느린 탐색', '전체 스캔', '행 수 증가', '비용 상승'], logs:[['14:20:01','rows scanned: 120000'],['14:20:02','match found late'],['14:20:03','response slow']] },
        '#index': { title:'색인 찾기 — 먼저 안내표를 본다', summary:'자주 찾는 열에 대한 별도 목록이 있으면 시작 위치를 훨씬 빨리 좁힐 수 있습니다.', active:1, progress:28, hot:1, chips:['정렬된 안내표', '범위 축소', '빠른 시작', '자주 찾는 열'], logs:[['14:20:04','index lookup by email'],['14:20:05','page narrowed'],['14:20:06','candidate rows ready']] },
        '#lookup': { title:'위치 점프 — 필요한 데이터만 읽는다', summary:'색인으로 위치를 찾은 뒤 실제 데이터 영역으로 바로 이동합니다.', active:1, progress:12, hot:2, chips:['점프 접근', '선별 읽기', '조회 가속', '핵심 행'], logs:[['14:20:07','offset jumped'],['14:20:08','target row opened'],['14:20:09','query returned fast']] },
        '#cost': { title:'정리 비용 — 쓰기 때도 카드 갱신', summary:'인덱스는 공짜가 아니라 새 데이터 입력이나 수정 때 함께 업데이트해야 합니다.', active:2, progress:46, hot:3, chips:['쓰기 비용', '공간 증가', '선택적 생성', '균형 필요'], logs:[['14:20:10','insert row'],['14:20:11','index updated'],['14:20:12','write cost accepted']] },
      };
      function render() {
        const scene = scenes[scenes[location.hash] ? location.hash : '#scan'];
        const cards = [
          ['본 데이터 더미', scene.progress + '% 읽음'],
          ['색인 카드', '값 -> 위치 안내'],
          ['조회 결과', '필요한 행만 열기'],
        ].map((item, index) => '<div class="card' + (scene.active === index ? ' active' : '') + '"><strong>' + item[0] + '</strong><div style="font-size:11px;color:var(--muted);margin-top:4px;">' + item[1] + '</div><div class="progress"><div class="fill" style="width:' + (index === 0 ? scene.progress : Math.max(14, 100 - scene.progress)) + '%"></div></div></div>').join('');
        const chips = scene.chips.map((chip, index) => '<span class="chip' + (scene.hot === index ? ' hot' : '') + '">' + chip + '</span>').join('');
        const logs = scene.logs.map((row) => '<div class="line"><span class="time">' + row[0] + '</span>' + row[1] + '</div>').join('');
        document.getElementById('app').innerHTML = '<div class="screen"><section class="hero"><p class="eyebrow">인덱스 원리</p><h1>' + scene.title + '</h1><p class="summary">' + scene.summary + '</p></section><section class="cards">' + cards + '<div class="chips">' + chips + '</div></section><section class="log"><p class="eyebrow" style="color:#bbf7d0;">검색 로그</p>' + logs + '</section></div>';
      }
      window.addEventListener('hashchange', render);
      render();
    </script>
  </body>
</html>
