<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>모듈에서 패키지까지 한눈에</title>
    <style>
      :root {
        --bg: #f8fafc;
        --card: #ffffff;
        --text: #0f172a;
        --muted: #64748b;
        --border: #d8e1eb;
        --accent: #0f766e;
        --accent-soft: #ecfeff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: 'Pretendard Variable', 'Noto Sans KR', sans-serif;
      }

      body {
        overflow: hidden;
      }

      #app {
        width: 100%;
        height: 100%;
        overflow-y: auto;
      }

      .screen {
        min-height: 100%;
        padding: 16px 14px 22px;
      }

      .hero,
      .diagram,
      .log {
        border: 1px solid var(--border);
        border-radius: 18px;
        background: var(--card);
      }

      .hero {
        padding: 16px;
        background: linear-gradient(135deg, #ecfeff, #ffffff);
      }

      .eyebrow {
        margin: 0 0 6px;
        font-size: 11px;
        color: var(--muted);
      }

      h1 {
        margin: 0;
        font-size: 18px;
      }

      .summary {
        margin: 8px 0 0;
        font-size: 12px;
        line-height: 1.7;
      }

      .diagram {
        margin-top: 12px;
        padding: 14px;
      }

      .shelf {
        padding: 12px;
        border-radius: 16px;
        border: 1px solid var(--border);
        background: #fff;
      }

      .shelf.active {
        border-color: var(--accent);
        background: var(--accent-soft);
      }

      .shelf h2 {
        margin: 0 0 8px;
        font-size: 12px;
      }

      .books {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .book {
        padding: 8px 10px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: #fff;
        font-size: 11px;
      }

      .book.hot {
        border-color: #2dd4bf;
        background: #f0fdfa;
        color: #115e59;
      }

      .arrow {
        margin: 8px 0;
        text-align: center;
        font-size: 18px;
        color: #14b8a6;
      }

      .note {
        margin-top: 10px;
        padding: 10px 12px;
        border-radius: 14px;
        border: 1px solid var(--border);
        background: #f8fafc;
        font-size: 11px;
        line-height: 1.7;
        color: #334155;
      }

      .log {
        margin-top: 12px;
        padding: 12px 14px;
        background: #102a43;
        color: #f8fafc;
      }

      .line {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 10px;
        line-height: 1.7;
      }

      .time {
        color: #5eead4;
        margin-right: 6px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      const scenes = {
        '#module': {
          title: '단일 모듈',
          summary: '한 가지 기능을 맡는 작은 코드 묶음은 모듈에 가깝습니다.',
          active: 0,
          books: ['date-format.ts', 'login-check.ts', 'file-reader.ts'],
          hot: 0,
          note: '모듈은 특정 기능 하나를 맡는 경우가 많아서 문제가 생기면 어디를 고쳐야 할지 찾기 쉽습니다.',
          logs: [
            ['11:40:01', 'date-format 모듈 불러오기'],
            ['11:40:02', '필요 기능만 재사용'],
            ['11:40:03', '나머지 코드와 분리 유지'],
          ],
        },
        '#package': {
          title: '패키지 묶음',
          summary: '여러 모듈을 하나의 배포 단위로 묶으면 패키지가 됩니다.',
          active: 1,
          books: ['core 모듈', 'utils 모듈', 'parser 모듈', 'docs'],
          hot: 1,
          note: '패키지는 책장처럼 여러 모듈을 함께 들여오는 단위입니다. 설치 후에는 필요한 모듈만 골라 쓸 수 있습니다.',
          logs: [
            ['11:40:04', 'package.json 읽기'],
            ['11:40:05', '모듈 묶음 설치 준비'],
            ['11:40:06', '배포 단위 확인'],
          ],
        },
        '#dependency': {
          title: '의존성 연결',
          summary: '가져온 패키지가 다른 패키지에 기대고 있으면 의존성이 이어집니다.',
          active: 2,
          books: ['ui-kit', 'color-tool', 'icon-pack', 'shared-utils'],
          hot: 2,
          note: '내가 직접 쓰는 패키지 하나가 내부적으로 다른 패키지를 더 끌고 올 수 있습니다. 그래서 버전 관리가 중요해집니다.',
          logs: [
            ['11:40:07', 'ui-kit 설치 요청'],
            ['11:40:08', '필요 의존성 3개 확인'],
            ['11:40:09', '버전 충돌 검사'],
          ],
        },
        '#install': {
          title: 'npm install',
          summary: '패키지 매니저는 원하는 패키지와 그 의존성을 받아와 프로젝트에 맞게 정리합니다.',
          active: 3,
          books: ['npm install chart-kit', 'lockfile 갱신', 'node_modules 배치'],
          hot: 0,
          note: 'npm이나 pip는 설치 자체뿐 아니라 버전 기록과 재현 가능한 환경 유지까지 함께 맡습니다.',
          logs: [
            ['11:40:10', '설치 명령 수신'],
            ['11:40:11', '의존성 트리 다운로드'],
            ['11:40:12', '버전 고정 정보 저장'],
          ],
        },
      };

      function render() {
        const hash = scenes[location.hash] ? location.hash : '#module';
        const scene = scenes[hash];
        const shelves = ['모듈', '패키지', '의존성', '설치']
          .map((label, index) => '<div class="shelf' + (scene.active === index ? ' active' : '') + '"><h2>' + label + '</h2></div>')
          .join('<div class="arrow">↓</div>');
        const books = scene.books
          .map((item, index) => '<span class="book' + (scene.hot === index ? ' hot' : '') + '">' + item + '</span>')
          .join('');
        const logs = scene.logs.map((row) => '<div class="line"><span class="time">' + row[0] + '</span>' + row[1] + '</div>').join('');

        document.getElementById('app').innerHTML =
          '<div class="screen"><section class="hero"><p class="eyebrow">모듈과 패키지</p><h1>' +
          scene.title +
          '</h1><p class="summary">' +
          scene.summary +
          '</p></section><section class="diagram">' +
          shelves +
          '<div class="books" style="margin-top:10px;">' +
          books +
          '</div><div class="note">' +
          scene.note +
          '</div></section><section class="log"><p class="eyebrow" style="color:#99f6e4;">설치 로그</p>' +
          logs +
          '</section></div>';
      }

      window.addEventListener('hashchange', render);
      render();
    </script>
  </body>
</html>
