<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>시스템과 응용을 나누는 분류 트리</title>
    <style>
      :root {
        --bg: #f7f7fb;
        --card: #ffffff;
        --text: #111827;
        --muted: #6b7280;
        --border: #dbe2ea;
        --accent: #2563eb;
        --accent-soft: #eff6ff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: 'Pretendard Variable', 'Noto Sans KR', sans-serif;
      }

      body {
        overflow: hidden;
      }

      #app {
        width: 100%;
        height: 100%;
        overflow-y: auto;
      }

      .screen {
        min-height: 100%;
        padding: 16px 14px 22px;
      }

      .hero,
      .tree,
      .log {
        border: 1px solid var(--border);
        border-radius: 18px;
        background: var(--card);
      }

      .hero {
        padding: 16px;
        background: linear-gradient(135deg, #eff6ff, #ffffff);
      }

      .eyebrow {
        margin: 0 0 6px;
        font-size: 11px;
        color: var(--muted);
      }

      h1 {
        margin: 0;
        font-size: 18px;
      }

      .summary {
        margin: 8px 0 0;
        font-size: 12px;
        line-height: 1.7;
      }

      .tree {
        margin-top: 12px;
        padding: 14px;
      }

      .branch-title {
        margin: 0 0 10px;
        font-size: 13px;
      }

      .root {
        padding: 10px 12px;
        border-radius: 14px;
        border: 1px solid var(--border);
        background: #f8fafc;
        text-align: center;
        font-size: 12px;
        font-weight: 700;
      }

      .fork {
        margin: 10px 0;
        text-align: center;
        color: #93c5fd;
        font-size: 18px;
      }

      .branches {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .branch {
        padding: 12px;
        border-radius: 16px;
        border: 1px solid var(--border);
        background: #fff;
      }

      .branch.active {
        border-color: var(--accent);
        background: var(--accent-soft);
      }

      .branch h2 {
        margin: 0 0 6px;
        font-size: 12px;
      }

      .branch p {
        margin: 0;
        font-size: 11px;
        line-height: 1.6;
        color: var(--muted);
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
      }

      .chip {
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: #fff;
        font-size: 11px;
      }

      .chip.hot {
        border-color: #93c5fd;
        background: var(--accent-soft);
        color: #1d4ed8;
      }

      .log {
        margin-top: 12px;
        padding: 12px 14px;
        background: #0f172a;
        color: #f8fafc;
      }

      .line {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 10px;
        line-height: 1.7;
      }

      .time {
        color: #93c5fd;
        margin-right: 6px;
      }

      @media (max-width: 375px) {
        .branches {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      const scenes = {
        '#os': {
          title: 'OS — 시스템 SW',
          summary: '운영체제는 CPU, 메모리, 파일, 장치를 정리하는 시스템 소프트웨어의 대표 사례입니다.',
          active: [0],
          chips: ['Windows', 'macOS', 'Linux', 'Android'],
          hot: 0,
          logs: [
            ['09:00:01', '부팅 후 자원 관리자 시작'],
            ['09:00:02', '메모리와 파일 규칙 로드'],
            ['09:00:03', '앱 실행 바닥 준비 완료'],
          ],
        },
        '#driver': {
          title: '드라이버 — 장치 연결',
          summary: '드라이버는 키보드, 프린터, 그래픽 카드처럼 실제 장치를 운영체제와 연결하는 시스템 쪽 도구입니다.',
          active: [0],
          chips: ['프린터 드라이버', '그래픽 드라이버', '오디오 드라이버'],
          hot: 1,
          logs: [
            ['09:00:04', '새 장치 연결 감지'],
            ['09:00:05', '장치용 규칙 로드'],
            ['09:00:06', '입출력 신호 변환 준비'],
          ],
        },
        '#app': {
          title: '앱 — 응용 SW',
          summary: '문서 작성기, 메신저, 게임처럼 사용자가 목표를 이루기 위해 직접 쓰는 프로그램은 응용 소프트웨어입니다.',
          active: [1],
          chips: ['문서 작성', '메신저', '그림 편집', '게임'],
          hot: 0,
          logs: [
            ['09:00:07', '사용자 앱 실행 요청'],
            ['09:00:08', '운영체제가 필요한 자원 배정'],
            ['09:00:09', '목적 중심 작업 시작'],
          ],
        },
        '#middleware': {
          title: '미들웨어 — 중간층',
          summary: '미들웨어는 응용 프로그램이 공통 기능과 연결을 쉽게 쓰도록 받쳐 주는 중간층입니다.',
          active: [0, 1],
          chips: ['DB 연결', '메시지 큐', '실행 환경', '공통 인증'],
          hot: 2,
          logs: [
            ['09:00:10', '앱 공통 서비스 요청'],
            ['09:00:11', '중간층에서 연결과 규칙 제공'],
            ['09:00:12', '시스템과 응용 사이 통로 확보'],
          ],
        },
      };

      function render() {
        const hash = scenes[location.hash] ? location.hash : '#os';
        const scene = scenes[hash];
        const branches = [
          {
            title: '시스템 소프트웨어',
            desc: '컴퓨터 바닥에서 자원과 장치를 관리합니다.',
          },
          {
            title: '응용 소프트웨어',
            desc: '사용자가 직접 목적을 이루는 도구입니다.',
          },
        ]
          .map((branch, index) => {
            const active = scene.active.indexOf(index) >= 0 ? ' active' : '';
            return '<div class="branch' + active + '"><h2>' + branch.title + '</h2><p>' + branch.desc + '</p></div>';
          })
          .join('');
        const chips = scene.chips
          .map((chip, index) => '<span class="chip' + (scene.hot === index ? ' hot' : '') + '">' + chip + '</span>')
          .join('');
        const logs = scene.logs.map((row) => '<div class="line"><span class="time">' + row[0] + '</span>' + row[1] + '</div>').join('');

        document.getElementById('app').innerHTML =
          '<div class="screen"><section class="hero"><p class="eyebrow">소프트웨어 분류</p><h1>' +
          scene.title +
          '</h1><p class="summary">' +
          scene.summary +
          '</p></section><section class="tree"><h2 class="branch-title">학교 행정실 vs 교실 수업처럼 나누기</h2><div class="root">소프트웨어</div><div class="fork">↙︎  ↘︎</div><div class="branches">' +
          branches +
          '</div><div class="chips">' +
          chips +
          '</div></section><section class="log"><p class="eyebrow" style="color:#bfdbfe;">분류 로그</p>' +
          logs +
          '</section></div>';
      }

      window.addEventListener('hashchange', render);
      render();
    </script>
  </body>
</html>
