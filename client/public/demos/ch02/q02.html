<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>라이선스로 보는 소프트웨어 선택</title>
    <style>
      :root {
        --bg: #fffdf7;
        --card: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --border: #e5e7eb;
        --accent: #ca8a04;
        --accent-soft: #fef3c7;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: 'Pretendard Variable', 'Noto Sans KR', sans-serif;
      }

      body {
        overflow: hidden;
      }

      #app {
        width: 100%;
        height: 100%;
        overflow-y: auto;
      }

      .screen {
        min-height: 100%;
        padding: 16px 14px 22px;
      }

      .hero,
      .cards,
      .log {
        border: 1px solid var(--border);
        border-radius: 18px;
        background: var(--card);
      }

      .hero {
        padding: 16px;
        background: linear-gradient(135deg, #fffbeb, #ffffff);
      }

      .eyebrow {
        margin: 0 0 6px;
        font-size: 11px;
        color: var(--muted);
      }

      h1 {
        margin: 0;
        font-size: 18px;
      }

      .summary {
        margin: 8px 0 0;
        font-size: 12px;
        line-height: 1.7;
      }

      .cards {
        margin-top: 12px;
        padding: 14px;
        display: grid;
        gap: 10px;
      }

      .card {
        padding: 12px;
        border-radius: 16px;
        border: 1px solid var(--border);
        background: #fff;
      }

      .card.active {
        border-color: var(--accent);
        background: var(--accent-soft);
      }

      .card h2 {
        margin: 0 0 6px;
        font-size: 12px;
      }

      .card p {
        margin: 0;
        font-size: 11px;
        line-height: 1.6;
        color: var(--muted);
      }

      .rule-list {
        margin-top: 10px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .rule {
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: #fff;
        font-size: 11px;
      }

      .rule.hot {
        border-color: #fbbf24;
        background: #fffbeb;
        color: #92400e;
      }

      .log {
        margin-top: 12px;
        padding: 12px 14px;
        background: #1f2937;
        color: #f9fafb;
      }

      .line {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 10px;
        line-height: 1.7;
      }

      .time {
        color: #fcd34d;
        margin-right: 6px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      const scenes = {
        '#open': {
          title: '오픈소스 자유',
          summary: '코드를 보고 고치고 다시 나눌 수 있는 범위가 라이선스로 열려 있는 경우입니다.',
          active: 0,
          rules: ['소스 공개', '수정 가능', '배포 가능', '조건 확인 필요'],
          hot: 0,
          logs: [
            ['10:22:01', '저장소에서 코드 열람'],
            ['10:22:02', '필요한 기능 수정'],
            ['10:22:03', '라이선스 조건 검토 후 재배포'],
          ],
        },
        '#commercial': {
          title: '상용 비용',
          summary: '제작사가 제공 범위를 정하고, 사용자는 비용이나 구독을 통해 이용 권한을 받습니다.',
          active: 1,
          rules: ['구매 또는 구독', '소스 비공개', '지원 제공', '계약 범위 내 사용'],
          hot: 0,
          logs: [
            ['10:22:04', '라이선스 구매 확인'],
            ['10:22:05', '설치 수량 검증'],
            ['10:22:06', '업무용 사용 권한 적용'],
          ],
        },
        '#gpl': {
          title: 'GPL 공개 의무',
          summary: '오픈소스라도 수정본을 배포할 때 같은 공개 약속을 따라야 하는 경우가 있습니다.',
          active: 2,
          rules: ['수정 가능', '배포 가능', '수정본 공개 의무 가능', '라이선스 계승'],
          hot: 2,
          logs: [
            ['10:22:07', 'GPL 프로젝트 포크'],
            ['10:22:08', '기능 수정 완료'],
            ['10:22:09', '배포 시 소스 공개 확인'],
          ],
        },
        '#student': {
          title: '학생용 제한',
          summary: '같은 제품이라도 학생용은 학습 목적에 맞게 허용 범위가 좁게 설정될 수 있습니다.',
          active: 3,
          rules: ['교육 목적 허용', '상업적 사용 제한 가능', '기간 제한 가능', '계정 인증 필요'],
          hot: 1,
          logs: [
            ['10:22:10', '학교 이메일 인증'],
            ['10:22:11', '학생 라이선스 활성화'],
            ['10:22:12', '상업적 이용 제한 안내'],
          ],
        },
      };

      const cards = [
        ['오픈소스', '공유와 수정이 가능한 쪽'],
        ['상용', '계약과 비용이 중심인 쪽'],
        ['GPL', '공개 의무가 붙을 수 있는 규칙'],
        ['학생용', '용도에 따라 제한된 라이선스'],
      ];

      function render() {
        const hash = scenes[location.hash] ? location.hash : '#open';
        const scene = scenes[hash];
        const cardMarkup = cards
          .map((card, index) => {
            const active = scene.active === index ? ' active' : '';
            return '<div class="card' + active + '"><h2>' + card[0] + '</h2><p>' + card[1] + '</p></div>';
          })
          .join('');
        const rules = scene.rules
          .map((item, index) => '<span class="rule' + (scene.hot === index ? ' hot' : '') + '">' + item + '</span>')
          .join('');
        const logs = scene.logs.map((row) => '<div class="line"><span class="time">' + row[0] + '</span>' + row[1] + '</div>').join('');

        document.getElementById('app').innerHTML =
          '<div class="screen"><section class="hero"><p class="eyebrow">라이선스 비교</p><h1>' +
          scene.title +
          '</h1><p class="summary">' +
          scene.summary +
          '</p></section><section class="cards">' +
          cardMarkup +
          '<div class="rule-list">' +
          rules +
          '</div></section><section class="log"><p class="eyebrow" style="color:#fde68a;">검토 로그</p>' +
          logs +
          '</section></div>';
      }

      window.addEventListener('hashchange', render);
      render();
    </script>
  </body>
</html>
