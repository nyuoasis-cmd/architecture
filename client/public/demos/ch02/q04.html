<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>클라우드 서비스 계층</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --card: #ffffff;
        --text: #172033;
        --muted: #667085;
        --border: #d7deea;
        --accent: #7c3aed;
        --accent-soft: #f5f3ff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: 'Pretendard Variable', 'Noto Sans KR', sans-serif;
      }

      body {
        overflow: hidden;
      }

      #app {
        width: 100%;
        height: 100%;
        overflow-y: auto;
      }

      .screen {
        min-height: 100%;
        padding: 16px 14px 22px;
      }

      .hero,
      .stack,
      .log {
        border: 1px solid var(--border);
        border-radius: 18px;
        background: var(--card);
      }

      .hero {
        padding: 16px;
        background: linear-gradient(135deg, #f5f3ff, #ffffff);
      }

      .eyebrow {
        margin: 0 0 6px;
        font-size: 11px;
        color: var(--muted);
      }

      h1 {
        margin: 0;
        font-size: 18px;
      }

      .summary {
        margin: 8px 0 0;
        font-size: 12px;
        line-height: 1.7;
      }

      .stack {
        margin-top: 12px;
        padding: 14px;
      }

      .layer {
        padding: 11px 12px;
        border-radius: 15px;
        border: 1px solid var(--border);
        background: #fff;
      }

      .layer + .layer {
        margin-top: 8px;
      }

      .layer.active {
        border-color: var(--accent);
        background: var(--accent-soft);
      }

      .layer h2 {
        margin: 0 0 4px;
        font-size: 12px;
      }

      .layer p {
        margin: 0;
        font-size: 11px;
        line-height: 1.6;
        color: var(--muted);
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
      }

      .chip {
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: #fff;
        font-size: 11px;
      }

      .chip.hot {
        border-color: #c4b5fd;
        background: var(--accent-soft);
        color: #5b21b6;
      }

      .log {
        margin-top: 12px;
        padding: 12px 14px;
        background: #111827;
        color: #f8fafc;
      }

      .line {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 10px;
        line-height: 1.7;
      }

      .time {
        color: #c4b5fd;
        margin-right: 6px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      const scenes = {
        '#iaas': {
          title: 'IaaS — 인프라',
          summary: '서버, 저장소, 네트워크 같은 바닥 자원을 빌려 쓰는 단계입니다.',
          active: 0,
          chips: ['가상 서버', '디스크', '네트워크', '확장 가능'],
          hot: 0,
          logs: [
            ['14:30:01', '서버 2대 생성'],
            ['14:30:02', '저장소 200GB 연결'],
            ['14:30:03', '네트워크 규칙 적용'],
          ],
        },
        '#paas': {
          title: 'PaaS — 실행 기반',
          summary: '개발자가 서버 세부 설정보다 실행 환경과 배포 흐름에 더 집중하게 돕는 단계입니다.',
          active: 1,
          chips: ['런타임', '배포 파이프라인', '로그', '자동 확장'],
          hot: 1,
          logs: [
            ['14:30:04', '코드 배포 요청'],
            ['14:30:05', '실행 환경 자동 구성'],
            ['14:30:06', '앱 인스턴스 기동'],
          ],
        },
        '#saas': {
          title: 'SaaS — 완성 서비스',
          summary: '사용자는 브라우저나 앱으로 접속해 바로 기능을 쓰고, 내부 장비는 신경 쓰지 않습니다.',
          active: 2,
          chips: ['문서 작성', '메일', '협업', '브라우저 접속'],
          hot: 3,
          logs: [
            ['14:30:07', '사용자 로그인'],
            ['14:30:08', '문서 편집 화면 제공'],
            ['14:30:09', '자동 저장과 공유 실행'],
          ],
        },
        '#subscription': {
          title: '구독 — 이용 방식',
          summary: '특히 SaaS는 계정과 구독을 기준으로 어디서나 같은 도구를 이어 쓰는 경우가 많습니다.',
          active: 2,
          chips: ['월 구독', '계정 기반', '인터넷 접근', '자동 업데이트'],
          hot: 0,
          logs: [
            ['14:30:10', '요금제 확인'],
            ['14:30:11', '계정별 기능 활성화'],
            ['14:30:12', '최신 버전 자동 반영'],
          ],
        },
      };

      const layers = [
        ['IaaS', '바닥 자원'],
        ['PaaS', '실행 환경'],
        ['SaaS', '완성형 소프트웨어'],
      ];

      function render() {
        const hash = scenes[location.hash] ? location.hash : '#iaas';
        const scene = scenes[hash];
        const layerMarkup = layers
          .map((layer, index) => {
            const active = scene.active === index ? ' active' : '';
            return '<div class="layer' + active + '"><h2>' + layer[0] + '</h2><p>' + layer[1] + '</p></div>';
          })
          .join('');
        const chips = scene.chips
          .map((item, index) => '<span class="chip' + (scene.hot === index ? ' hot' : '') + '">' + item + '</span>')
          .join('');
        const logs = scene.logs.map((row) => '<div class="line"><span class="time">' + row[0] + '</span>' + row[1] + '</div>').join('');

        document.getElementById('app').innerHTML =
          '<div class="screen"><section class="hero"><p class="eyebrow">클라우드 계층</p><h1>' +
          scene.title +
          '</h1><p class="summary">' +
          scene.summary +
          '</p></section><section class="stack">' +
          layerMarkup +
          '<div class="chips">' +
          chips +
          '</div></section><section class="log"><p class="eyebrow" style="color:#ddd6fe;">서비스 로그</p>' +
          logs +
          '</section></div>';
      }

      window.addEventListener('hashchange', render);
      render();
    </script>
  </body>
</html>
