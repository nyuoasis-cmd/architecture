<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>쿠버네티스 관제실</title>
    <style>
      :root {
        --bg: #f7fff9;
        --card: #ffffff;
        --border: #cee9d4;
        --text: #10301a;
        --muted: #63806b;
        --accent: #2c9a5a;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; background: var(--bg); color: var(--text); font-family: 'Pretendard Variable', 'Noto Sans KR', sans-serif; }
      body { overflow: hidden; }
      .demo { height: 100%; padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 10px; font-size: 12px; overflow-y: auto; }
      h4 { margin: 0; font-size: 14px; }
      .sub { margin: 0; color: var(--muted); line-height: 1.5; }
      .board { display: grid; gap: 8px; }
      .card { border: 1px solid var(--border); border-radius: 12px; padding: 10px; background: var(--card); }
      .card.active { border-color: var(--accent); background: #ebfbef; }
      .eyebrow { margin: 0 0 6px; font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
      .meter { height: 10px; border-radius: 999px; background: #dff3e3; overflow: hidden; margin-top: 8px; }
      .fill { height: 100%; background: var(--accent); }
      .note { border-radius: 12px; padding: 10px 12px; background: #10301a; color: #f7fff9; line-height: 1.6; }
    </style>
  </head>
  <body>
    <div id="screen"></div>
    <script>
      const scenarioMap = {
        '#desired': { title: '원하는 상태', body: '웹 컨테이너 3개 유지', percent: 100, note: '쿠버네티스는 먼저 원하는 상태를 선언해 두고 실제 상태를 계속 맞추려 합니다.' },
        '#heal': { title: '자가 복구', body: '1개 장애 -> 새 파드 자동 생성', percent: 66, note: '복제본 하나가 사라지면 스스로 새 인스턴스를 만들어 원래 개수를 회복합니다.' },
        '#scale': { title: '자동 확장', body: '요청 증가 -> 3개에서 6개로 확장', percent: 85, note: '트래픽이 늘면 복제본 수를 늘리고 한가해지면 줄여 자원을 조절할 수 있습니다.' },
        '#rollout': { title: '점진 배포', body: 'v1 일부 교체 -> 확인 후 v2 확대', percent: 50, note: '새 버전을 한 번에 갈아끼우지 않고 조금씩 교체하며 문제 여부를 확인합니다.' },
      };

      function render() {
        const hash = scenarioMap[location.hash] ? location.hash : '#desired';
        const item = scenarioMap[hash];
        document.getElementById('screen').innerHTML =
          '<div class="demo">' +
          '<h4>쿠버네티스 관제실</h4>' +
          '<p class="sub">컨테이너를 많이 운영할수록 배치와 복구, 확장, 배포를 사람이 수동으로 하기 어려워집니다.</p>' +
          '<div class="board">' +
          '<div class="card active"><p class="eyebrow">' + item.title + '</p><div>' + item.body + '</div><div class="meter"><div class="fill" style="width:' + item.percent + '%"></div></div></div>' +
          '<div class="card"><p class="eyebrow">운영 관점</p><div>배치 · 복구 · 스케일링 · 롤링 업데이트</div></div>' +
          '</div>' +
          '<div class="note">▶ ' + item.note + '</div>' +
          '</div>';
      }

      window.addEventListener('hashchange', render);
      render();
    </script>
  </body>
</html>
