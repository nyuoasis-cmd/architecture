<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LLM 다음 토큰 예측기</title>
    <style>
      :root {
        --bg: #fffef6;
        --card: #ffffff;
        --border: #ece5b8;
        --text: #332b0b;
        --muted: #84764d;
        --accent: #b69b1f;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; background: var(--bg); color: var(--text); font-family: 'Pretendard Variable', 'Noto Sans KR', sans-serif; }
      body { overflow: hidden; }
      .demo { height: 100%; padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 10px; font-size: 12px; overflow-y: auto; }
      h4 { margin: 0; font-size: 14px; }
      .sub { margin: 0; color: var(--muted); line-height: 1.5; }
      .cards { display: grid; gap: 8px; }
      .card { border: 1px solid var(--border); border-radius: 12px; padding: 10px; background: var(--card); }
      .card.active { border-color: var(--accent); background: #fff9d8; }
      .eyebrow { margin: 0 0 4px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
      .tokens { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
      .token { padding: 4px 7px; border-radius: 8px; background: #f6f0bf; }
      .note { border-radius: 12px; padding: 10px 12px; background: #332b0b; color: #fffef6; line-height: 1.6; }
    </style>
  </head>
  <body>
    <div id="screen"></div>
    <script>
      const scenarioMap = {
        '#context': { title: '문맥 읽기', tokens: ['질문', '앞선 대화', '지시문'], note: '모델은 먼저 지금까지 나온 문맥을 함께 보고 다음 출력을 정합니다.' },
        '#predict': { title: '다음 토큰', tokens: ['다음', '올', '단어?'], note: 'LLM의 기본 동작은 가장 그럴듯한 다음 토큰을 확률적으로 고르는 일입니다.' },
        '#repeat': { title: '반복 생성', tokens: ['예측', '이어쓰기', '문장 완성'], note: '다음 토큰 예측을 여러 번 반복해 한 문장, 한 단락이 만들어집니다.' },
        '#limit': { title: '검증 한계', tokens: ['그럴듯함', '사실 확인 필요', '문맥 제한'], note: '자연스러운 문장을 잘 만들더라도 사실 검증과 최신 정보 확인은 별도 절차가 필요할 수 있습니다.' },
      };

      function render() {
        const hash = scenarioMap[location.hash] ? location.hash : '#context';
        const item = scenarioMap[hash];
        document.getElementById('screen').innerHTML =
          '<div class="demo">' +
          '<h4>LLM 다음 토큰 예측기</h4>' +
          '<p class="sub">문맥을 본 뒤 다음에 올 조각을 고르고, 그 선택을 반복해 응답을 만듭니다.</p>' +
          '<div class="cards">' +
          '<div class="card active"><p class="eyebrow">' + item.title + '</p><div class="tokens">' + item.tokens.map((token) => '<span class="token">' + token + '</span>').join('') + '</div></div>' +
          '<div class="card"><p class="eyebrow">기억 포인트</p><div>다음 토큰 예측 · 문맥 활용 · 검증 보완</div></div>' +
          '</div>' +
          '<div class="note">▶ ' + item.note + '</div>' +
          '</div>';
      }

      window.addEventListener('hashchange', render);
      render();
    </script>
  </body>
</html>
