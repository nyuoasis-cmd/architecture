<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>클라우드 책임 층계</title>
    <style>
      :root {
        --bg: #fffaf0;
        --card: #ffffff;
        --border: #e7d8c7;
        --text: #2d1f12;
        --muted: #8a6f56;
        --accent: #c26d2d;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; background: var(--bg); color: var(--text); font-family: 'Pretendard Variable', 'Noto Sans KR', sans-serif; }
      body { overflow: hidden; }
      .demo { height: 100%; padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 10px; font-size: 12px; overflow-y: auto; }
      h4 { margin: 0; font-size: 14px; }
      .sub { margin: 0; color: var(--muted); line-height: 1.5; }
      .stack { display: grid; gap: 8px; }
      .step { border: 1px solid var(--border); border-radius: 12px; padding: 10px; background: var(--card); }
      .step.active { border-color: var(--accent); background: #fff1e5; }
      .eyebrow { margin: 0 0 4px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; }
      .chip { padding: 4px 8px; border-radius: 999px; background: #f8ede2; }
      .note { border-radius: 12px; padding: 10px 12px; background: #2d1f12; color: #fffaf5; line-height: 1.6; }
    </style>
  </head>
  <body>
    <div id="screen"></div>
    <script>
      const scenarioMap = {
        '#iaas': {
          active: 'iaas',
          cards: [
            ['IaaS', ['서버', '저장소', '네트워크']],
            ['사용자 몫', ['OS 설치', '앱 배포', '운영 관리']],
            ['비유', ['빈 사무실', '설비는 제공', '배치는 직접']],
          ],
          note: 'IaaS는 바닥 인프라를 빌리는 단계라, 사용자가 더 많은 운영 책임을 집니다.',
        },
        '#paas': {
          active: 'paas',
          cards: [
            ['PaaS', ['런타임', '배포 환경', '운영 자동화 일부']],
            ['개발자 집중점', ['코드', '비즈니스 로직', '릴리스']],
            ['비유', ['공유 주방', '장비 준비됨', '요리에 집중']],
          ],
          note: 'PaaS는 실행 기반까지 준비돼 있어 서버 관리보다 애플리케이션 개발에 집중하기 쉽습니다.',
        },
        '#saas': {
          active: 'saas',
          cards: [
            ['SaaS', ['완성 앱', '계정 로그인', '바로 사용']],
            ['사용자 몫', ['설정', '업무 데이터', '사용 정책']],
            ['비유', ['배달 음식', '바로 소비', '주방 운영은 제공자']],
          ],
          note: 'SaaS는 완성된 소프트웨어를 바로 쓰는 단계라 내부 운영은 제공자가 대부분 맡습니다.',
        },
        '#boundary': {
          active: 'boundary',
          cards: [
            ['누가 관리하나?', ['IaaS - 사용자 많음', 'PaaS - 공동 부담', 'SaaS - 제공자 중심']],
            ['같은 클라우드라도', ['책임 경계가 다름', '운영 난이도도 다름']],
            ['기억 포인트', ['기술명보다 관리 범위', '무엇을 직접 할지']],
          ],
          note: '세 용어의 핵심 차이는 기능 이름보다 책임 경계가 어디서 바뀌는가에 있습니다.',
        },
      };

      function render() {
        const hash = scenarioMap[location.hash] ? location.hash : '#iaas';
        const { active, cards, note } = scenarioMap[hash];
        document.getElementById('screen').innerHTML =
          '<div class="demo">' +
          '<h4>클라우드 책임 층계</h4>' +
          '<p class="sub">같은 클라우드라도 누가 어디까지 맡는지 보면 IaaS, PaaS, SaaS가 정리됩니다.</p>' +
          '<div class="stack">' +
          cards.map(([title, items]) =>
            '<div class="step' + (title.toLowerCase().includes(active) ? ' active' : '') + '"><p class="eyebrow">' + title + '</p><div class="chips">' +
            items.map((item) => '<span class="chip">' + item + '</span>').join('') +
            '</div></div>'
          ).join('') +
          '</div>' +
          '<div class="note">▶ ' + note + '</div>' +
          '</div>';
      }

      window.addEventListener('hashchange', render);
      render();
    </script>
  </body>
</html>
