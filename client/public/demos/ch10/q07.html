<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>클라우드 보안 성문</title>
    <style>
      :root {
        --bg: #fbfaf7;
        --card: #ffffff;
        --border: #dfd8ca;
        --text: #2c2418;
        --muted: #7a6d59;
        --accent: #8f6c2d;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; background: var(--bg); color: var(--text); font-family: 'Pretendard Variable', 'Noto Sans KR', sans-serif; }
      body { overflow: hidden; }
      .demo { height: 100%; padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 10px; font-size: 12px; overflow-y: auto; }
      h4 { margin: 0; font-size: 14px; }
      .sub { margin: 0; color: var(--muted); line-height: 1.5; }
      .grid { display: grid; gap: 8px; }
      .card { border: 1px solid var(--border); border-radius: 12px; padding: 10px; background: var(--card); }
      .card.active { border-color: var(--accent); background: #f7f0e0; }
      .eyebrow { margin: 0 0 6px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
      .badge { display: inline-block; margin-right: 6px; margin-bottom: 6px; padding: 4px 8px; border-radius: 999px; background: #efe7d4; }
      .note { border-radius: 12px; padding: 10px 12px; background: #2c2418; color: #fbfaf7; line-height: 1.6; }
    </style>
  </head>
  <body>
    <div id="screen"></div>
    <script>
      const scenarioMap = {
        '#iam': { title: 'IAM 권한', badges: ['사용자', '서비스 계정', '최소 권한'], note: 'IAM은 누가 어떤 자원에 접근할 수 있는지 세밀하게 나누는 첫 번째 보안 축입니다.' },
        '#encrypt': { title: '암호화', badges: ['저장 중 보호', '전송 중 보호', '중간 유출 방지'], note: '암호화는 저장 중인 데이터와 이동 중인 데이터를 중간에서 쉽게 읽지 못하게 보호합니다.' },
        '#segment': { title: '네트워크 격리', badges: ['공개 영역', '내부 전용 영역', '공격 범위 축소'], note: '서버를 같은 공개망에 다 두지 않고 역할별 구역으로 나누면 침해가 퍼지는 범위를 줄일 수 있습니다.' },
        '#monitor': { title: '로그 감시', badges: ['접근 기록', '이상 탐지', '사후 추적'], note: '로그와 모니터링이 있어야 이상 징후를 빨리 찾고 대응 과정을 남길 수 있습니다.' },
      };

      function render() {
        const hash = scenarioMap[location.hash] ? location.hash : '#iam';
        const item = scenarioMap[hash];
        document.getElementById('screen').innerHTML =
          '<div class="demo">' +
          '<h4>클라우드 보안 성문</h4>' +
          '<p class="sub">권한, 암호화, 네트워크 경계, 로그 감시를 겹쳐 두어야 보안이 실제로 강해집니다.</p>' +
          '<div class="grid">' +
          '<div class="card active"><p class="eyebrow">' + item.title + '</p>' +
          item.badges.map((badge) => '<span class="badge">' + badge + '</span>').join('') +
          '</div>' +
          '<div class="card"><p class="eyebrow">기억 포인트</p><div>한 가지 도구보다 여러 층의 원칙을 겹쳐 두는 것이 중요합니다.</div></div>' +
          '</div>' +
          '<div class="note">▶ ' + item.note + '</div>' +
          '</div>';
      }

      window.addEventListener('hashchange', render);
      render();
    </script>
  </body>
</html>
