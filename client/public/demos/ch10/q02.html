<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>컨테이너 표준 상자</title>
    <style>
      :root {
        --bg: #f8fbff;
        --card: #ffffff;
        --border: #cdddf0;
        --text: #122033;
        --muted: #66778d;
        --accent: #2f6fb3;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; background: var(--bg); color: var(--text); font-family: 'Pretendard Variable', 'Noto Sans KR', sans-serif; }
      body { overflow: hidden; }
      .demo { height: 100%; padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 10px; font-size: 12px; overflow-y: auto; }
      h4 { margin: 0; font-size: 14px; }
      .sub { margin: 0; color: var(--muted); line-height: 1.5; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .card { border: 1px solid var(--border); border-radius: 12px; padding: 10px; background: var(--card); }
      .card.active { border-color: var(--accent); background: #eaf3ff; }
      .eyebrow { margin: 0 0 6px; font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
      .list { display: flex; flex-direction: column; gap: 6px; }
      .row { padding: 5px 7px; border-radius: 8px; background: #f1f6fc; }
      .note { border-radius: 12px; padding: 10px 12px; background: #122033; color: #f8fbff; line-height: 1.6; }
    </style>
  </head>
  <body>
    <div id="screen"></div>
    <script>
      const scenarioMap = {
        '#bundle': {
          active: 'bundle',
          left: ['앱 코드', '라이브러리', '설정 파일'],
          right: ['한 묶음으로 포장', '어디서나 비슷하게 실행'],
          note: '컨테이너는 애플리케이션과 필요한 실행 환경을 함께 묶는 표준 상자입니다.',
        },
        '#image': {
          active: 'image',
          left: ['읽기 전용 템플릿', '버전 관리', '반복 재현'],
          right: ['이미지 = 설계도', '컨테이너 = 실행본'],
          note: '이미지는 컨테이너를 만들기 위한 설계도이고, 실행 중 상태는 컨테이너입니다.',
        },
        '#run': {
          active: 'run',
          left: ['같은 이미지', '컨테이너 A', '컨테이너 B'],
          right: ['복제 쉬움', '시작 빠름', '배포 반복 용이'],
          note: '같은 이미지를 여러 번 실행하면 같은 환경을 빠르게 반복 재현할 수 있습니다.',
        },
        '#share': {
          active: 'share',
          left: ['호스트 커널 공유', '필요 범위만 격리'],
          right: ['가상머신보다 가벼움', '자원 효율 좋음'],
          note: '컨테이너는 운영체제 전체를 따로 띄우지 않고 커널을 공유해 더 가볍게 동작합니다.',
        },
      };

      function render() {
        const hash = scenarioMap[location.hash] ? location.hash : '#bundle';
        const { active, left, right, note } = scenarioMap[hash];
        const rows = (items) => items.map((item) => '<div class="row">' + item + '</div>').join('');
        document.getElementById('screen').innerHTML =
          '<div class="demo">' +
          '<h4>컨테이너 표준 상자</h4>' +
          '<p class="sub">도커는 앱을 표준 상자처럼 포장해 환경 차이를 줄이고 이동성을 높입니다.</p>' +
          '<div class="grid">' +
          '<div class="card active"><p class="eyebrow">' + active + '</p><div class="list">' + rows(left) + '</div></div>' +
          '<div class="card"><p class="eyebrow">핵심 효과</p><div class="list">' + rows(right) + '</div></div>' +
          '</div>' +
          '<div class="note">▶ ' + note + '</div>' +
          '</div>';
      }

      window.addEventListener('hashchange', render);
      render();
    </script>
  </body>
</html>
