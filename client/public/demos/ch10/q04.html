<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI 가족 트리</title>
    <style>
      :root {
        --bg: #fff9fc;
        --card: #ffffff;
        --border: #ead3df;
        --text: #341624;
        --muted: #8d6679;
        --accent: #c55288;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; background: var(--bg); color: var(--text); font-family: 'Pretendard Variable', 'Noto Sans KR', sans-serif; }
      body { overflow: hidden; }
      .demo { height: 100%; padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 10px; font-size: 12px; overflow-y: auto; }
      h4 { margin: 0; font-size: 14px; }
      .sub { margin: 0; color: var(--muted); line-height: 1.5; }
      .nest { display: grid; gap: 8px; }
      .card { border: 1px solid var(--border); border-radius: 12px; padding: 10px; background: var(--card); }
      .card.level1 { margin-left: 0; }
      .card.level2 { margin-left: 14px; }
      .card.level3 { margin-left: 28px; }
      .card.active { border-color: var(--accent); background: #fff0f7; }
      .eyebrow { margin: 0 0 4px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
      .note { border-radius: 12px; padding: 10px 12px; background: #341624; color: #fff8fb; line-height: 1.6; }
    </style>
  </head>
  <body>
    <div id="screen"></div>
    <script>
      const scenarioMap = {
        '#ai': { active: 'ai', note: 'AI는 사람처럼 판단하거나 문제를 풀게 하려는 가장 넓은 목표입니다.' },
        '#ml': { active: 'ml', note: '머신러닝은 데이터를 보고 패턴을 배우게 하는 AI의 대표 방법입니다.' },
        '#dl': { active: 'dl', note: '딥러닝은 신경망을 활용하는 머신러닝의 한 갈래로, 더 복잡한 패턴 학습에 강합니다.' },
        '#scope': { active: 'scope', note: 'AI > ML > DL 순서로 포함 관계를 기억하면 세 용어가 훨씬 덜 헷갈립니다.' },
      };

      function render() {
        const hash = scenarioMap[location.hash] ? location.hash : '#ai';
        const { active, note } = scenarioMap[hash];
        document.getElementById('screen').innerHTML =
          '<div class="demo">' +
          '<h4>AI 가족 트리</h4>' +
          '<p class="sub">세 용어는 같은 말이 아니라 큰 상자 안에 더 구체적인 방법이 들어가는 관계입니다.</p>' +
          '<div class="nest">' +
          '<div class="card level1' + (active === 'ai' || active === 'scope' ? ' active' : '') + '"><p class="eyebrow">AI</p><div>가장 넓은 목표 - 사람처럼 판단하는 기계</div></div>' +
          '<div class="card level2' + (active === 'ml' || active === 'scope' ? ' active' : '') + '"><p class="eyebrow">ML</p><div>데이터에서 패턴을 배우는 방법</div></div>' +
          '<div class="card level3' + (active === 'dl' || active === 'scope' ? ' active' : '') + '"><p class="eyebrow">DL</p><div>신경망을 활용하는 ML의 한 갈래</div></div>' +
          '</div>' +
          '<div class="note">▶ ' + note + '</div>' +
          '</div>';
      }

      window.addEventListener('hashchange', render);
      render();
    </script>
  </body>
</html>
