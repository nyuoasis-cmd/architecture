<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DB 창고 고르기</title>
    <style>
      :root {
        --bg: #fffdf8;
        --card: #ffffff;
        --border: #e7e5e4;
        --text: #1c1917;
        --muted: #78716c;
        --accent: #0f766e;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; font-family: 'Pretendard Variable', 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); }
      body { overflow: hidden; }
      .demo { height: 100%; padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 10px; font-size: 12px; overflow-y: auto; }
      h4 { margin: 0; font-size: 14px; }
      .sub { margin: 0; color: var(--muted); line-height: 1.5; }
      .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .card { border: 1px solid var(--border); border-radius: 12px; padding: 10px; background: var(--card); }
      .card.active { border-color: var(--accent); background: #f0fdfa; }
      .eyebrow { margin: 0 0 6px; font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; }
      .chip { border-radius: 999px; background: #f5f5f4; padding: 4px 8px; }
      .note { border-radius: 12px; background: #1c1917; color: #fafaf9; padding: 10px 12px; line-height: 1.6; }
    </style>
  </head>
  <body>
    <div id="screen"></div>
    <script>
      const scenarioMap = {
        '#schema': {
          active: 'rdbms',
          left: ['고정 스키마', '관계/조인', '제약 조건'],
          right: ['속성 변경 느림', '설계 먼저'],
          note: 'RDBMS는 칸과 규칙을 먼저 정해 두고, 그 질서를 오래 유지하는 데 강합니다.',
        },
        '#document': {
          active: 'nosql',
          left: ['문서별 속성 차이 허용', '빠른 변경', 'JSON 친화적'],
          right: ['일관성은 앱이 더 챙길 때가 많음', '형태가 자주 바뀜'],
          note: 'NoSQL은 모든 항목이 같은 모양일 필요가 없을 때 더 유연하게 대응합니다.',
        },
        '#join': {
          active: 'rdbms',
          left: ['주문표', '고객표', '상품표'],
          right: ['조인으로 연결해 질문', '중복 줄이기'],
          note: '관계형 모델은 여러 표를 키로 연결해 복합 질문을 던질 때 특히 강합니다.',
        },
        '#scale': {
          active: 'nosql',
          left: ['수평 확장', '샤딩 친화적', '대량 로그'],
          right: ['구조보다 처리량 우선', '서비스 분산'],
          note: '분산 저장과 빠른 확장이 중요할 때는 NoSQL 계열이 더 편한 경우가 많습니다.',
        },
      };

      function render() {
        const hash = scenarioMap[location.hash] ? location.hash : '#schema';
        const { active, left, right, note } = scenarioMap[hash];
        const chips = (items) => items.map((item) => '<span class="chip">' + item + '</span>').join('');
        document.getElementById('screen').innerHTML =
          '<div class="demo">' +
          '<h4>DB 창고 고르기</h4>' +
          '<p class="sub">데이터를 얼마나 엄격한 칸에 넣을지에 따라 선택이 달라집니다.</p>' +
          '<div class="cols">' +
          '<div class="card' + (active === 'rdbms' ? ' active' : '') + '"><p class="eyebrow">RDBMS</p><div class="chips">' + chips(left) + '</div></div>' +
          '<div class="card' + (active === 'nosql' ? ' active' : '') + '"><p class="eyebrow">NoSQL</p><div class="chips">' + chips(right) + '</div></div>' +
          '</div>' +
          '<div class="note">▶ ' + note + '</div>' +
          '</div>';
      }

      window.addEventListener('hashchange', render);
      render();
    </script>
  </body>
</html>
