<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>정규화 분리함</title>
    <style>
      :root {
        --bg: #fffdf8;
        --card: #ffffff;
        --border: #e7e5e4;
        --text: #1c1917;
        --muted: #78716c;
        --accent: #dc2626;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; font-family: 'Pretendard Variable', 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); }
      body { overflow: hidden; }
      .demo { height: 100%; padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 10px; font-size: 12px; overflow-y: auto; }
      h4 { margin: 0; font-size: 14px; }
      .sub { margin: 0; color: var(--muted); line-height: 1.5; }
      .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .card { border: 1px solid var(--border); border-radius: 12px; padding: 10px; background: var(--card); }
      .card.active { border-color: var(--accent); background: #fef2f2; }
      ul { margin: 0; padding-left: 16px; line-height: 1.6; }
      .note { border-radius: 12px; background: #1f2937; color: #f9fafb; padding: 10px 12px; line-height: 1.6; }
    </style>
  </head>
  <body>
    <div id="screen"></div>
    <script>
      const scenarioMap = {
        '#mixed': {
          left: ['주문번호', '고객명', '고객주소', '상품명'],
          right: ['같은 주소 반복', '행마다 중복'],
          active: 0,
          note: '한 표에 다 넣으면 보기엔 편해도 같은 정보가 여러 줄에 반복되기 쉽습니다.',
        },
        '#split': {
          left: ['고객표: 고객ID, 주소', '주문표: 주문ID, 고객ID'],
          right: ['한 번만 저장', 'ID로 연결'],
          active: 1,
          note: '고객 정보와 주문 정보를 나누면 같은 주소를 여러 번 적지 않아도 됩니다.',
        },
        '#anomaly': {
          left: ['주소 변경', '10개 주문 행 수정'],
          right: ['1개만 놓치면 모순'],
          active: 0,
          note: '정규화는 이런 수정 이상을 줄이는 데 큰 목적이 있습니다.',
        },
        '#normal3': {
          left: ['1NF: 한 칸 한 값', '2NF: 부분 종속 분리'],
          right: ['3NF: 이행 종속 분리'],
          active: 1,
          note: '1, 2, 3정규형은 중복과 종속 문제를 단계적으로 줄여 가는 감각으로 이해하면 됩니다.',
        },
      };

      function render() {
        const hash = scenarioMap[location.hash] ? location.hash : '#mixed';
        const { left, right, active, note } = scenarioMap[hash];
        const list = (items) => '<ul>' + items.map((item) => '<li>' + item + '</li>').join('') + '</ul>';
        document.getElementById('screen').innerHTML =
          '<div class="demo">' +
          '<h4>정규화 분리함</h4>' +
          '<p class="sub">중복을 줄이면 수정과 삭제 때 생기는 모순도 함께 줄어듭니다.</p>' +
          '<div class="cols">' +
          '<div class="card' + (active === 0 ? ' active' : '') + '">' + list(left) + '</div>' +
          '<div class="card' + (active === 1 ? ' active' : '') + '">' + list(right) + '</div>' +
          '</div>' +
          '<div class="note">▶ ' + note + '</div>' +
          '</div>';
      }

      window.addEventListener('hashchange', render);
      render();
    </script>
  </body>
</html>
