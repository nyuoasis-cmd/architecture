<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>격리 수준 신호등</title>
    <style>
      :root {
        --bg: #fffdf8;
        --card: #ffffff;
        --border: #e7e5e4;
        --text: #1c1917;
        --muted: #78716c;
        --accent: #059669;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; font-family: 'Pretendard Variable', 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); }
      body { overflow: hidden; }
      .demo { height: 100%; padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 10px; font-size: 12px; overflow-y: auto; }
      h4 { margin: 0; font-size: 14px; }
      .sub { margin: 0; color: var(--muted); line-height: 1.5; }
      .bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
      .level { border: 1px solid var(--border); border-radius: 10px; padding: 8px 6px; text-align: center; background: #fff; }
      .level.active { border-color: var(--accent); background: #ecfdf5; }
      .card { border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; background: var(--card); line-height: 1.7; }
      .note { border-radius: 12px; background: #111827; color: #f9fafb; padding: 10px 12px; line-height: 1.6; }
    </style>
  </head>
  <body>
    <div id="screen"></div>
    <script>
      const scenarioMap = {
        '#dirty': { active: 0, text: '아직 확정되지 않은 값을 읽어 버리는 더티 리드는 가장 약한 수준에서 생길 수 있습니다.' },
        '#committed': { active: 1, text: 'Read Committed는 최소한 커밋된 값만 보게 해 더티 리드를 막지만, 같은 행을 다시 읽을 때 값이 달라질 수 있습니다.' },
        '#repeatable': { active: 2, text: 'Repeatable Read는 같은 행을 두 번 읽을 때 결과가 바뀌지 않도록 더 강하게 보호합니다.' },
        '#serial': { active: 3, text: 'Serializable은 마치 트랜잭션이 한 줄로 차례대로 처리된 것처럼 보이게 하지만, 대기 비용이 가장 커질 수 있습니다.' },
      };

      function render() {
        const hash = scenarioMap[location.hash] ? location.hash : '#dirty';
        const { active, text } = scenarioMap[hash];
        const labels = ['Read Uncommitted', 'Read Committed', 'Repeatable Read', 'Serializable'];
        const bar = labels.map((label, idx) => '<div class="level' + (idx === active ? ' active' : '') + '">' + label + '</div>').join('');
        document.getElementById('screen').innerHTML =
          '<div class="demo">' +
          '<h4>격리 수준 신호등</h4>' +
          '<p class="sub">정확성을 높일수록 대기와 잠금 비용도 함께 커질 수 있습니다.</p>' +
          '<div class="bar">' + bar + '</div>' +
          '<div class="card">' + text + '</div>' +
          '<div class="note">▶ 격리 수준은 무조건 최고를 고르는 문제가 아니라, 업무별 정확성과 처리량 사이의 균형을 정하는 선택입니다.</div>' +
          '</div>';
      }

      window.addEventListener('hashchange', render);
      render();
    </script>
  </body>
</html>
