<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ACID 금고</title>
    <style>
      :root {
        --bg: #fffdf8;
        --card: #ffffff;
        --border: #e7e5e4;
        --text: #1c1917;
        --muted: #78716c;
        --accent: #b45309;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; font-family: 'Pretendard Variable', 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); }
      body { overflow: hidden; }
      .demo { height: 100%; padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 10px; font-size: 12px; overflow-y: auto; }
      h4 { margin: 0; font-size: 14px; }
      .sub { margin: 0; color: var(--muted); line-height: 1.5; }
      .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .card { border: 1px solid var(--border); border-radius: 12px; padding: 10px; background: var(--card); }
      .card.active { border-color: var(--accent); background: #fffbeb; }
      .eyebrow { margin: 0 0 6px; font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
      .note { border-radius: 12px; background: #1c1917; color: #fafaf9; padding: 10px 12px; line-height: 1.6; }
    </style>
  </head>
  <body>
    <div id="screen"></div>
    <script>
      const scenarioMap = {
        '#atomic': { idx: 0, text: '출금과 입금이 한 묶음으로 움직여, 하나라도 실패하면 전체를 취소합니다.' },
        '#consistent': { idx: 1, text: '계좌 잔액 규칙이나 외래 키 제약 같은 약속이 작업 전후에도 깨지지 않아야 합니다.' },
        '#isolated': { idx: 2, text: '동시에 실행되는 거래가 서로의 미완성 결과를 함부로 보지 못하게 막습니다.' },
        '#durable': { idx: 3, text: '성공 완료된 결과는 장애나 재시작 뒤에도 장부에 남아 있어야 합니다.' },
      };

      function render() {
        const hash = scenarioMap[location.hash] ? location.hash : '#atomic';
        const { idx, text } = scenarioMap[hash];
        const labels = ['Atomicity', 'Consistency', 'Isolation', 'Durability'];
        const cards = labels.map((label, i) => '<div class="card' + (i === idx ? ' active' : '') + '"><p class="eyebrow">ACID</p><strong>' + label + '</strong></div>').join('');
        document.getElementById('screen').innerHTML =
          '<div class="demo">' +
          '<h4>ACID 금고</h4>' +
          '<p class="sub">거래가 안전하게 끝나려면 네 가지 약속이 함께 지켜져야 합니다.</p>' +
          '<div class="grid">' + cards + '</div>' +
          '<div class="note">▶ ' + text + '</div>' +
          '</div>';
      }

      window.addEventListener('hashchange', render);
      render();
    </script>
  </body>
</html>
