<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>인덱스 색인대</title>
    <style>
      :root {
        --bg: #fffdf8;
        --card: #ffffff;
        --border: #e7e5e4;
        --text: #1c1917;
        --muted: #78716c;
        --accent: #7c3aed;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; font-family: 'Pretendard Variable', 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); }
      body { overflow: hidden; }
      .demo { height: 100%; padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 10px; font-size: 12px; overflow-y: auto; }
      h4 { margin: 0; font-size: 14px; }
      .sub { margin: 0; color: var(--muted); line-height: 1.5; }
      .bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
      .slot { border: 1px solid var(--border); border-radius: 10px; padding: 8px 6px; text-align: center; background: #fff; }
      .slot.active { border-color: var(--accent); background: #f3e8ff; }
      .card { border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; background: var(--card); line-height: 1.7; }
      .note { border-radius: 12px; background: #111827; color: #f9fafb; padding: 10px 12px; line-height: 1.6; }
    </style>
  </head>
  <body>
    <div id="screen"></div>
    <script>
      const scenarioMap = {
        '#scan': { active: 0, body: '인덱스가 없으면 첫 행부터 끝 행까지 하나씩 비교하는 전체 스캔이 일어날 수 있습니다.' },
        '#tree': { active: 1, body: 'B-tree는 큰 범위를 가지 단위로 줄여 가며 조건에 맞는 위치에 빠르게 접근합니다.' },
        '#range': { active: 2, body: '정렬된 구조 덕분에 시작점만 찾으면 범위 검색도 연속해서 읽기 쉬워집니다.' },
        '#cost': { active: 3, body: '대신 새 값을 넣거나 바꿀 때는 인덱스 구조도 함께 갱신해야 하므로 쓰기 비용이 늘 수 있습니다.' },
      };

      function render() {
        const hash = scenarioMap[location.hash] ? location.hash : '#scan';
        const { active, body } = scenarioMap[hash];
        const labels = ['전체 스캔', '트리 탐색', '범위 검색', '유지 비용'];
        const slots = labels.map((label, idx) => '<div class="slot' + (idx === active ? ' active' : '') + '">' + label + '</div>').join('');
        document.getElementById('screen').innerHTML =
          '<div class="demo">' +
          '<h4>인덱스 색인대</h4>' +
          '<p class="sub">검색 속도는 어디까지 한 번에 건너뛸 수 있느냐에서 큰 차이가 납니다.</p>' +
          '<div class="bar">' + slots + '</div>' +
          '<div class="card">' + body + '</div>' +
          '<div class="note">▶ 인덱스는 읽기를 빠르게 하지만, 쓰기와 저장 공간에는 추가 비용을 요구합니다.</div>' +
          '</div>';
      }

      window.addEventListener('hashchange', render);
      render();
    </script>
  </body>
</html>
