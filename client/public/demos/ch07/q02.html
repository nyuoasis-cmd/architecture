<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SQL 주문서</title>
    <style>
      :root {
        --bg: #fffdf8;
        --card: #ffffff;
        --border: #e7e5e4;
        --text: #1c1917;
        --muted: #78716c;
        --accent: #2563eb;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; font-family: 'Pretendard Variable', 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); }
      body { overflow: hidden; }
      .demo { height: 100%; padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 10px; font-size: 12px; overflow-y: auto; }
      h4 { margin: 0; font-size: 14px; }
      .sub { margin: 0; color: var(--muted); line-height: 1.5; }
      .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .card { border: 1px solid var(--border); border-radius: 12px; padding: 10px; background: var(--card); }
      .card.active { border-color: var(--accent); background: #eff6ff; }
      pre { margin: 0; white-space: pre-wrap; font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 1.5; }
      .note { border-radius: 12px; background: #0f172a; color: #f8fafc; padding: 10px 12px; line-height: 1.6; }
    </style>
  </head>
  <body>
    <div id="screen"></div>
    <script>
      const scenarioMap = {
        '#select': { active: 0, sql: 'SELECT name\nFROM students\nWHERE score >= 90;', note: '조회는 원하는 열과 조건을 적어 필요한 행만 찾는 작업입니다.' },
        '#insert': { active: 1, sql: "INSERT INTO orders (id, item)\nVALUES (101, 'keyboard');", note: 'INSERT는 새 행을 추가합니다. 주문서 한 줄을 새로 접수하는 느낌입니다.' },
        '#update': { active: 2, sql: "UPDATE orders\nSET status = 'paid'\nWHERE id = 101;", note: 'UPDATE는 기존 값을 바꿉니다. WHERE가 빠지면 범위가 너무 넓어질 수 있습니다.' },
        '#delete': { active: 3, sql: 'DELETE FROM cart\nWHERE expired = true;', note: 'DELETE는 필요 없는 행을 지우는 명령입니다. 실행 전 대상 범위를 꼭 확인해야 합니다.' },
      };

      function render() {
        const hash = scenarioMap[location.hash] ? location.hash : '#select';
        const { active, sql, note } = scenarioMap[hash];
        const labels = ['SELECT', 'INSERT', 'UPDATE', 'DELETE'];
        const cards = labels.map((label, idx) => '<div class="card' + (idx === active ? ' active' : '') + '">' + label + '</div>').join('');
        document.getElementById('screen').innerHTML =
          '<div class="demo">' +
          '<h4>SQL 주문서</h4>' +
          '<p class="sub">데이터베이스에 무엇을 하고 싶은지 문장으로 정확히 적어 보냅니다.</p>' +
          '<div class="grid">' + cards + '</div>' +
          '<div class="card"><pre>' + sql + '</pre></div>' +
          '<div class="note">▶ ' + note + '</div>' +
          '</div>';
      }

      window.addEventListener('hashchange', render);
      render();
    </script>
  </body>
</html>
